<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#128663">
<title>HY-LITE 单词 | 环亚国际教育</title>
<style>
:root{
  --bg:#EFF6F3; --card:#FFFFFF; --card2:#E7F1EC; --ink:#122B26; --sub:#4C6A64; --line:#D8E6E1;
  --mint:#128663; --mintD:#0A6B4C; --mintT:rgba(18,134,99,.12);
  --amber:#A96E04; --amberD:#7E5203; --amberT:rgba(169,110,4,.13);
  --red:#C93A3F; --redD:#992A2E; --redT:rgba(201,58,63,.11);
  --blue:#1E7DB4; --onbtn:#FFFFFF; --shadow:0 1px 3px rgba(18,43,38,.08);
  --hedge:transparent; --nedge:#D8E6E1;
  --sans:'MiSans','HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1A1D; --card:#152528; --card2:#1D3237; --ink:#E8F3F0; --sub:#8CA7A3; --line:#264046;
    --mint:#31C79A; --mintD:#1E8A6B; --mintT:rgba(49,199,154,.14);
    --amber:#FFB454; --amberD:#C77F26; --amberT:rgba(255,180,84,.15);
    --red:#FF6B6B; --redD:#C24A4A; --redT:rgba(255,107,107,.14);
    --blue:#5CC8FF; --onbtn:#06231B; --shadow:0 1px 3px rgba(0,0,0,.3);
    --hedge:transparent; --nedge:#264046;
  }
}
:root[data-theme="light"]{
  --bg:#EFF6F3; --card:#FFFFFF; --card2:#E7F1EC; --ink:#122B26; --sub:#4C6A64; --line:#D8E6E1;
  --mint:#128663; --mintD:#0A6B4C; --mintT:rgba(18,134,99,.12);
  --amber:#A96E04; --amberD:#7E5203; --amberT:rgba(169,110,4,.13);
  --red:#C93A3F; --redD:#992A2E; --redT:rgba(201,58,63,.11);
  --blue:#1E7DB4; --onbtn:#FFFFFF; --shadow:0 1px 3px rgba(18,43,38,.08);
  --hedge:transparent; --nedge:#D8E6E1;
}
:root[data-theme="dark"]{
  --bg:#0D1A1D; --card:#152528; --card2:#1D3237; --ink:#E8F3F0; --sub:#8CA7A3; --line:#264046;
  --mint:#31C79A; --mintD:#1E8A6B; --mintT:rgba(49,199,154,.14);
  --amber:#FFB454; --amberD:#C77F26; --amberT:rgba(255,180,84,.15);
  --red:#FF6B6B; --redD:#C24A4A; --redT:rgba(255,107,107,.14);
  --blue:#5CC8FF; --onbtn:#06231B; --shadow:0 1px 3px rgba(0,0,0,.3);
  --hedge:transparent; --nedge:#264046;
}

/* ========== 浅色配色备选（data-pal，夜读统一不受影响） ========== */
/* ink 纸墨绿 · mono 白纸黑 · sand 纸墨赭；默认 mint 薄荷 */
@media (prefers-color-scheme:light){
  :root[data-pal="ink"]:not([data-theme="dark"]){
    --bg:#EFEAE0; --card:#F7F4EC; --card2:#E8E3D4; --ink:#1F1F1F; --sub:#67635A; --line:#D9D3C3;
    --mint:#4F6B54; --mintD:#38503D; --mintT:rgba(79,107,84,.13);
    --amber:#A85A36; --amberD:#7C3F22; --amberT:rgba(168,90,54,.13);
    --red:#B4432C; --redD:#88301F; --redT:rgba(180,67,44,.12);
    --blue:#3A6E8F; --onbtn:#FBF7EC; --shadow:0 1px 2px rgba(31,31,31,.06);
    --hedge:#1F1F1F; --nedge:#1F1F1F;
  }
  :root[data-pal="mono"]:not([data-theme="dark"]){
    --bg:#F7F6F2; --card:#FFFFFF; --card2:#EEEDE7; --ink:#191919; --sub:#5D5B54; --line:#DEDCD4;
    --mint:#1F1F1F; --mintD:#000000; --mintT:rgba(25,25,25,.07);
    --amber:#8C6B2F; --amberD:#63491D; --amberT:rgba(140,107,47,.12);
    --red:#B8342B; --redD:#8A241D; --redT:rgba(184,52,43,.1);
    --blue:#4A4A44; --onbtn:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.07);
    --hedge:#191919; --nedge:#191919;
  }
  :root[data-pal="sand"]:not([data-theme="dark"]){
    --bg:#EFE9DD; --card:#F8F4EA; --card2:#EAE3D2; --ink:#231F18; --sub:#6B6454; --line:#DBD3BE;
    --mint:#9C5230; --mintD:#71391F; --mintT:rgba(156,82,48,.12);
    --amber:#8C6B2F; --amberD:#61481C; --amberT:rgba(140,107,47,.13);
    --red:#9E2B22; --redD:#741F18; --redT:rgba(158,43,34,.11);
    --blue:#3A6E8F; --onbtn:#FCF8EE; --shadow:0 1px 2px rgba(35,31,24,.06);
    --hedge:#231F18; --nedge:#231F18;
  }
}
:root[data-theme="light"][data-pal="ink"]{
  --bg:#EFEAE0; --card:#F7F4EC; --card2:#E8E3D4; --ink:#1F1F1F; --sub:#67635A; --line:#D9D3C3;
  --mint:#4F6B54; --mintD:#38503D; --mintT:rgba(79,107,84,.13);
  --amber:#A85A36; --amberD:#7C3F22; --amberT:rgba(168,90,54,.13);
  --red:#B4432C; --redD:#88301F; --redT:rgba(180,67,44,.12);
  --blue:#3A6E8F; --onbtn:#FBF7EC; --shadow:0 1px 2px rgba(31,31,31,.06);
  --hedge:#1F1F1F; --nedge:#1F1F1F;
}
:root[data-theme="light"][data-pal="mono"]{
  --bg:#F7F6F2; --card:#FFFFFF; --card2:#EEEDE7; --ink:#191919; --sub:#5D5B54; --line:#DEDCD4;
  --mint:#1F1F1F; --mintD:#000000; --mintT:rgba(25,25,25,.07);
  --amber:#8C6B2F; --amberD:#63491D; --amberT:rgba(140,107,47,.12);
  --red:#B8342B; --redD:#8A241D; --redT:rgba(184,52,43,.1);
  --blue:#4A4A44; --onbtn:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.07);
  --hedge:#191919; --nedge:#191919;
}
:root[data-theme="light"][data-pal="sand"]{
  --bg:#EFE9DD; --card:#F8F4EA; --card2:#EAE3D2; --ink:#231F18; --sub:#6B6454; --line:#DBD3BE;
  --mint:#9C5230; --mintD:#71391F; --mintT:rgba(156,82,48,.12);
  --amber:#8C6B2F; --amberD:#61481C; --amberT:rgba(140,107,47,.13);
  --red:#9E2B22; --redD:#741F18; --redT:rgba(158,43,34,.11);
  --blue:#3A6E8F; --onbtn:#FCF8EE; --shadow:0 1px 2px rgba(35,31,24,.06);
  --hedge:#231F18; --nedge:#231F18;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px;overflow-x:hidden}
button{font-family:var(--sans);color:inherit;cursor:pointer;border:none;background:none;font-size:inherit}
input,textarea{font-family:var(--sans)}
:focus-visible{outline:2.5px solid var(--mint);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap;border-bottom:2.5px solid var(--hedge)}
@media (max-width:420px){
  .brand small{display:none}
  .chip{padding:3px 8px;font-size:11px}
  header{gap:6px}
}
.brand{font-size:17px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
.brand small{display:block;font-size:9.5px;font-weight:600;letter-spacing:2px;color:var(--sub)}
.hspace{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:var(--sub);box-shadow:var(--shadow);white-space:nowrap}
.chip b{color:var(--ink)}
.chip .flame{color:var(--amber)}
.chip .lv{color:var(--mint)}
.xpwrap{padding:0 16px 4px}
.xpbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--blue));border-radius:3px;transition:width .3s ease}
.xpcap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);font-weight:600;margin-top:3px}

/* ---------- nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-top:2px solid var(--nedge);z-index:40;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--sub)}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--mint)}
.nbadge{position:absolute;top:4px;right:calc(50% - 27px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:var(--onbtn);font-size:10.5px;line-height:17px;font-weight:800;letter-spacing:0}
.nbadge:empty{display:none}

/* ---------- layout ---------- */
main{padding:8px 16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec{font-size:12.5px;font-weight:800;letter-spacing:2px;color:var(--sub);margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--sub);font-size:13px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ---------- 3D buttons ---------- */
.b3d{display:block;width:100%;padding:14px;margin-top:12px;border-radius:16px;font-size:16.5px;font-weight:900;letter-spacing:3px;background:var(--mint);color:var(--onbtn);box-shadow:0 4px 0 var(--mintD);transition:transform .06s ease,box-shadow .06s ease,filter .12s}
.b3d:hover{filter:brightness(1.05)}
.b3d:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mintD)}
.b3d.amber{background:var(--amber);box-shadow:0 4px 0 var(--amberD)}
.b3d.amber:active{box-shadow:0 1px 0 var(--amberD)}
.b3d.red{background:var(--red);box-shadow:0 4px 0 var(--redD)}
.b3d.red:active{box-shadow:0 1px 0 var(--redD)}
.b3d.line{background:var(--card);color:var(--mint);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.b3d.line:active{box-shadow:0 1px 0 var(--line)}
.b3d.ghost{background:none;color:var(--sub);box-shadow:none;border:2px solid var(--line);font-weight:700}
.b3d:disabled{opacity:.45;pointer-events:none}
.row2{display:flex;gap:10px}.row2 .b3d{flex:1}
.mini{display:inline-block;width:auto;padding:8px 16px;margin:0;font-size:13px;letter-spacing:1px;border-radius:12px;box-shadow:0 3px 0 var(--mintD)}

/* ---------- 词书切换 ---------- */
.bookbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--mintT);border:1.5px solid var(--mint);border-radius:16px;padding:11px 14px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .08s}
.bookbar:active{transform:scale(.99)}
.bookbar .bk-ic{width:38px;height:38px;flex:none;border-radius:11px;background:var(--card);display:flex;align-items:center;justify-content:center}
.bookbar .bk-ic svg{width:21px;height:21px;stroke:var(--mint);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bookbar .bk-tt{flex:1;min-width:0}
.bookbar .bk-tt s{display:block;text-decoration:none;font-size:10.5px;letter-spacing:2px;color:var(--mintD);font-weight:700}
.bookbar .bk-tt b{font-size:17px;font-weight:900;color:var(--ink)}
.bookbar .bk-sw{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--mintD);background:var(--card);border-radius:99px;padding:5px 11px}
.bookbar .bk-sw svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bookopt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .08s,border-color .12s}
.bookopt:active{transform:scale(.99)}
.bookopt.on{border-color:var(--mint);background:var(--mintT)}
.bookopt b{font-size:16px;font-weight:800;display:inline-flex;align-items:center;gap:7px}

/* ---------- home plan ---------- */
.plan{display:flex;align-items:center;gap:16px}
.plan .rside{flex:1;min-width:0}
.plan .nums{display:flex;gap:18px;margin:2px 0 4px}
.plan .nums .n{font-size:26px;font-weight:900}
.plan .nums .n em{font-style:normal;font-size:13px;color:var(--sub);font-weight:600}
.plan .nums .l{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:1px}
.ring{position:relative;width:88px;height:88px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.ring .rc b{font-size:19px}
.ring .rc s{text-decoration:none;font-size:9.5px;color:var(--sub);letter-spacing:1px;font-weight:700}
.ckline{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);font-weight:600}
.ckline .ok{color:var(--mint);font-weight:800}
.report{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
.report .n{font-size:20px;font-weight:900;color:var(--mint)}
.report .n.warn{color:var(--amber)}
.report .l{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:1px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--ink);box-shadow:var(--shadow);transition:transform .08s}
.quick button:active{transform:scale(.94)}
.quick svg{width:24px;height:24px;stroke:var(--mint);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gbar{height:9px;background:var(--card2);border-radius:5px;overflow:hidden;display:flex}
.gbar i{display:block;height:100%}
.gbar .g1{background:var(--mint)}
.gbar .g2{background:var(--mint);opacity:.35}

/* ---------- train ---------- */
.mode{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 15px;margin-bottom:10px;width:100%;text-align:left;box-shadow:var(--shadow);transition:transform .08s}
.mode:active{transform:scale(.985)}
.mode .ic{width:42px;height:42px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--mintT)}
.mode .ic svg{width:22px;height:22px;stroke:var(--mint);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mode .ic.am{background:var(--amberT)}.mode .ic.am svg{stroke:var(--amber)}
.mode .ic.rd{background:var(--redT)}.mode .ic.rd svg{stroke:var(--red)}
.mode .tt{flex:1;min-width:0}
.mode .tt b{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
.mode .tt span{font-size:12px;color:var(--sub)}
.mode .ct{font-size:12px;font-weight:800;color:var(--sub);white-space:nowrap}
.mode .ct b{color:var(--mint);font-size:16px}
.pill{font-size:10px;font-weight:800;letter-spacing:1px;padding:1.5px 8px;border-radius:99px;background:var(--mintT);color:var(--mint)}
.pill.rd{background:var(--redT);color:var(--red)}
.pill.am{background:var(--amberT);color:var(--amber)}

/* ---------- session ---------- */
.stop{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.stop .x{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:16px;color:var(--sub);flex:none}
.sprog{flex:1;height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.sprog i{display:block;height:100%;background:var(--mint);border-radius:6px;transition:width .25s ease}
.combo{font-size:12px;font-weight:900;color:var(--amber);white-space:nowrap;min-width:52px;text-align:right}
.qword{font-size:clamp(34px,10vw,46px);font-weight:900;text-align:center;letter-spacing:.5px;padding:22px 8px 2px;word-break:break-word;line-height:1.15;cursor:pointer}
.qphon{text-align:center;color:var(--sub);font-size:14.5px;min-height:22px;font-style:italic}
.qask{text-align:center;color:var(--sub);font-size:13px;font-weight:700;letter-spacing:2px;margin:6px 0 12px}
.bigsay{display:flex;align-items:center;justify-content:center;width:96px;height:96px;margin:26px auto 8px;border-radius:50%;background:var(--mintT);border:2px solid var(--mint);transition:transform .08s}
.bigsay:active{transform:scale(.92)}
.bigsay svg{width:42px;height:42px;stroke:var(--mint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 15px 13px 44px;font-size:15.5px;font-weight:600;box-shadow:var(--shadow);transition:transform .07s,border-color .12s,background .12s}
.opt:active{transform:scale(.985)}
.opt .kno{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:21px;height:21px;border-radius:7px;background:var(--card2);color:var(--sub);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.opt.right{border-color:var(--mint);background:var(--mintT)}
.opt.right .kno{background:var(--mint);color:var(--onbtn)}
.opt.wrong{border-color:var(--red);background:var(--redT);animation:shake .3s ease}
.opt.dim{opacity:.5}
.opt:disabled{pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.reveal{animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.detail{background:var(--card);border:2px solid var(--mint);border-radius:18px;padding:16px;margin-top:14px}
.detail .dw{font-size:26px;font-weight:900}
.detail .dp{color:var(--sub);font-style:italic;font-size:13.5px}
.detail .dg{margin-top:6px;font-size:15.5px}
.dbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.dbtns button{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--sub);display:inline-flex;align-items:center;gap:5px}
.dbtns button.on{color:var(--amber);border-color:var(--amber)}
.dbtns button.zon{color:var(--red);border-color:var(--red)}
.dbtns button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.khint{text-align:center;font-size:11px;color:var(--sub);margin-top:14px;letter-spacing:.5px;display:none;font-weight:600}
@media (hover:hover) and (pointer:fine){.khint{display:block}}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10.5px;background:var(--card)}

/* spell */
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:18px 0 4px;min-height:44px}
.slot{width:30px;height:40px;border-bottom:3px solid var(--line);font-size:24px;font-weight:900;text-align:center;text-transform:lowercase}
.slot.hit{border-color:var(--mint);color:var(--mint)}
.slot.miss{border-color:var(--red);color:var(--red)}
.spellin{width:100%;margin-top:14px;padding:13px 16px;font-size:18px;font-weight:700;letter-spacing:2px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;text-align:center}
.spellin:focus{border-color:var(--mint);outline:none}
.gmeaning{text-align:center;font-size:18px;font-weight:700;padding:18px 14px 0;line-height:1.6}

/* flash 速刷 */
.fcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:44px 18px 34px;text-align:center;box-shadow:var(--shadow);margin-top:6px}

/* match 连连看 */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.mcell{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 10px;font-size:13.5px;font-weight:700;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);transition:transform .08s,opacity .25s,border-color .12s}
.mcell.sel{border-color:var(--blue);transform:scale(.97)}
.mcell.done{opacity:0;pointer-events:none;transform:scale(.85)}
.mcell.bad{border-color:var(--red);animation:shake .3s ease}
.mtimer{text-align:center;font-size:30px;font-weight:900;color:var(--mint);letter-spacing:1px}

/* ---------- library ---------- */
.search{width:100%;padding:12px 15px;font-size:15px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.search::placeholder{color:var(--sub)}
.search:focus{outline:none;border-color:var(--mint)}
.filters{display:flex;gap:7px;margin:10px 0 4px;flex-wrap:wrap}
.filters button{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:5px 13px;font-size:12px;font-weight:700;color:var(--sub)}
.filters button.on{background:var(--mint);border-color:var(--mint);color:var(--onbtn)}
.urow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 15px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform .08s}
.urow:active{transform:scale(.985)}
.urow .tt{flex:1;min-width:0}
.urow .tt b{font-size:14px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .gbar{margin-top:6px}
.urow .ct{font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap;text-align:right;line-height:1.5}
.wrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:none}
.wrow .wt{flex:1;min-width:0}
.wrow .wt b{font-size:16px;font-weight:800}
.wrow .wt .ph{font-size:11.5px;color:var(--sub);font-style:italic;margin-left:6px}
.wrow .wt .g{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .mark{color:var(--amber);flex:none}
/* ---------- 通读印象（整批词表） ---------- */
.wordlist{font-size:15.5px}
.wl-row{display:grid;grid-template-columns:26px 1fr auto;gap:1px 8px;padding:8px 2px;border-bottom:1px dashed var(--line);align-items:baseline}
.wl-row:last-child{border-bottom:none}
.wl-row .no{font-size:10.5px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.wl-row .w{font-weight:800;font-size:16px;cursor:pointer}
.wl-row .w:hover{color:var(--mint)}
.wl-row .ph{font-size:12px;color:var(--sub);font-style:italic;margin-left:7px}
.wl-row .g{grid-column:2/4;color:var(--sub);font-size:13.5px;line-height:1.55}
.covered .g{filter:blur(5px);cursor:pointer;user-select:none;transition:filter .15s ease}
.covered .g.open{filter:none}
.wl-row .starbtn{padding:2px 2px 2px 8px;font-size:17px}

.starbtn{flex:none;font-size:19px;line-height:1;color:var(--line);padding:8px 2px 8px 8px;cursor:pointer;user-select:none}
.starbtn:hover{color:var(--amber)}
.starbtn.on{color:var(--amber)}
.strength{display:inline-flex;gap:2.5px;flex:none}
.strength i{width:5px;height:14px;border-radius:2px;background:var(--card2)}
.strength i.f{background:var(--mint)}
.strength.z i.f{background:var(--red)}
.wstat{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--sub);flex:none;width:34px;text-align:right}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(8,20,17,.55)}
#modal.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 20px 30px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet .dw{font-size:34px;font-weight:900}
.sheet .dp{color:var(--sub);font-style:italic}
.saybtns{display:flex;gap:8px;margin:10px 0}
.saybtns button{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:6px 15px;font-size:12.5px;font-weight:700;color:var(--mint);display:inline-flex;gap:5px;align-items:center}
.saybtns button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet .dg{font-size:16.5px;margin:8px 0 12px;line-height:1.7}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv span{color:var(--sub)}
.notein{width:100%;margin-top:12px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14px;color:var(--ink);min-height:64px;resize:vertical}
.notein:focus{outline:none;border-color:var(--mint)}

/* ---------- stats ---------- */
.stgrid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
.stgrid .n{font-size:22px;font-weight:900;color:var(--mint)}
.stgrid .l{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:1px}
.hm-wrap{overflow-x:auto;padding:2px 0}
.hm{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;width:max-content}
.hm i{border-radius:2.5px;background:var(--card2)}
.hm i.l1{background:var(--mint);opacity:.25}
.hm i.l2{background:var(--mint);opacity:.48}
.hm i.l3{background:var(--mint);opacity:.72}
.hm i.l4{background:var(--mint);opacity:1}
.hm i.hmtd{outline:1.5px solid var(--amber);outline-offset:-1px}
.hm-cap{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--sub);margin-top:8px;font-weight:600;flex-wrap:wrap}
.cal{width:100%}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800;font-size:14px}
.calhead button{width:38px;height:38px;border-radius:12px;background:var(--card2);color:var(--sub);font-weight:900}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.calgrid .wd{font-size:10px;color:var(--sub);font-weight:800;padding:2px 0}
.cday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--sub)}
.cday.ck{background:var(--mint);color:var(--onbtn)}
.cday.q1{background:var(--mintT)}
.cday.q2{background:var(--mintT);box-shadow:inset 0 0 0 40px var(--mintT)}
.cday.q3{background:var(--mint);opacity:.55;color:var(--onbtn)}
.cday.td{outline:2px solid var(--amber);outline-offset:-2px;color:var(--ink)}
.cday.off{opacity:.3}
.bars{display:flex;gap:4px;align-items:flex-end;height:90px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.bars i{width:100%;max-width:20px;background:var(--mint);border-radius:3px 3px 0 0;min-height:2px}
.bars.load i{background:var(--amber)}
.bars b{font-size:9px;color:var(--sub);font-weight:700}
.bars s{text-decoration:none;font-size:9px;color:var(--sub)}
.hrow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:12.5px}
.hrow .hl{width:52px;color:var(--sub);font-weight:700;flex:none;text-align:right}
.hrow .ht{flex:1;height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.hrow .ht i{display:block;height:100%;background:var(--mint);border-radius:7px}
.hrow .hn{width:44px;font-weight:800;flex:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.badge .bi{width:38px;height:38px;margin:0 auto 6px;border-radius:50%;background:var(--mintT);display:flex;align-items:center;justify-content:center}
.badge .bi svg{width:19px;height:19px;stroke:var(--mint);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge b{font-size:11.5px;display:block}
.badge s{text-decoration:none;font-size:9.5px;color:var(--sub);display:block;margin-top:1px}
.badge.lock{opacity:.42;filter:grayscale(1)}

/* ---------- me / settings ---------- */
.seg{display:flex;background:var(--card2);border-radius:13px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:13px;font-weight:800;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--mint);box-shadow:var(--shadow)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:14px}
.setrow:last-child{border-bottom:none}
.setrow .st1{font-size:14.5px;font-weight:700}
.setrow .st2{font-size:11.5px;color:var(--sub)}
.tog{position:relative;width:46px;height:26px;border-radius:13px;background:var(--card2);border:1px solid var(--line);flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tog.on{background:var(--mint);border-color:var(--mint)}
.tog.on::after{left:22px}
.qopts{display:flex;gap:7px;flex-wrap:wrap}
.qopts button{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:7px 14px;font-size:13.5px;font-weight:800;color:var(--sub)}
.qopts button.on{background:var(--mint);border-color:var(--mint);color:var(--onbtn)}

/* ---------- end screen ---------- */
.endwrap{text-align:center;padding-top:10px}
.endwrap h2{font-size:22px;font-weight:900;margin:8px 0 2px}
.endwrap .sub{color:var(--sub);font-size:13px;font-weight:600}
.endstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:18px 0 4px;text-align:center}
.endstats .n{font-size:21px;font-weight:900;color:var(--mint)}
.endstats .n.am{color:var(--amber)}
.endstats .n.rd{color:var(--red)}
.endstats .l{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:1px}

/* ---------- toast & fx ---------- */
#ask{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(8,20,17,.6);padding:24px}
#ask.show{display:flex}
.askbox{width:100%;max-width:320px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:20px;animation:up .18s ease}
.askbox p{font-size:15px;line-height:1.7;margin-bottom:6px;white-space:pre-line}
#toasts{position:fixed;top:14px;left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 20px;font-size:13.5px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:tin .25s ease;max-width:88%}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
.toast.out{opacity:0;transition:opacity .3s}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}
.empty{text-align:center;color:var(--sub);padding:34px 10px;font-size:13.5px;line-height:2}
.empty svg{width:44px;height:44px;stroke:var(--line);fill:none;stroke-width:1.6;display:block;margin:0 auto 8px}
footer{text-align:center;color:var(--sub);font-size:10.5px;letter-spacing:1.5px;padding:26px 12px 10px;line-height:2;opacity:.8}
.back{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:800;color:var(--sub);padding:4px 2px;margin-bottom:8px}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ===== 训练界面自适应（小屏一屏放下，减少翻页） ===== */
.b3d.snext{position:sticky;bottom:10px;z-index:5}
@media (max-height:820px){
  .qword{padding:10px 8px 0;font-size:clamp(30px,9vw,40px)}
  .qask{margin:4px 0 8px}
  .bigsay{width:82px;height:82px;margin:12px auto 6px}
  .bigsay svg{width:36px;height:36px}
  .opts{gap:8px;margin-top:10px}
  .opt{padding:11px 13px 11px 42px;font-size:15px}
  .gmeaning{padding:12px 12px 0;font-size:17px}
  .detail{padding:12px;margin-top:10px}
  .detail .dw{font-size:22px}
}
@media (max-height:700px){
  .qword{font-size:clamp(26px,8vw,34px);padding:6px 8px 0}
  .bigsay{width:70px;height:70px;margin:8px auto 4px}
  .opts{gap:6px;margin-top:8px}
  .opt{padding:9px 12px 9px 40px;font-size:14.5px}
}

/* ===== 对/错反馈固定色（不随主题/配色/深浅模式变化：对=绿 错=红） ===== */
:root{ --okG:#1FA46B; --okGT:rgba(31,164,107,.16); --ngR:#E0433E; --ngRT:rgba(224,67,62,.14) }
[data-theme="dark"], :root[data-theme="dark"]{ --okG:#2ECC85; --okGT:rgba(46,204,133,.20); --ngR:#FF6B64; --ngRT:rgba(255,107,100,.18) }
.opt.right{border-color:var(--okG) !important;background:var(--okGT) !important}
.opt.right .kno{background:var(--okG) !important;color:#fff !important}
.opt.right::after{content:"✓ 正确";position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--okG);font-weight:900;font-size:13px;letter-spacing:1px}
.opt.wrong{border-color:var(--ngR) !important;background:var(--ngRT) !important}
.opt.wrong .kno{background:var(--ngR) !important;color:#fff !important}
.opt.wrong::after{content:"✕";position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--ngR);font-weight:900;font-size:15px}
.slot.hit{border-color:var(--okG) !important;color:var(--okG) !important}
.slot.miss{border-color:var(--ngR) !important;color:var(--ngR) !important}

/* ================= 学习伙伴 · 表情图鉴 ================= */
.petcard{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px 16px 12px;margin-bottom:12px}
.pettop{display:flex;align-items:center;gap:14px}
.petbig{flex-shrink:0;width:96px;height:96px;background:none;border:none;padding:0;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center}
.petbig img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.petq{font-size:44px;font-weight:900;color:var(--line)}
.petwiggle{animation:petwiggle .5s ease}
@keyframes petwiggle{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-7deg) scale(1.06)}75%{transform:rotate(7deg) scale(1.06)}}
.petinfo{flex:1;min-width:0}
.petname{font-weight:900;font-size:16px;cursor:pointer;display:inline-block}
.petsw{font-size:12px;color:var(--mint);font-weight:700;cursor:pointer;margin-left:6px}
.petbubble{position:absolute;left:16px;top:-12px;max-width:60%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:7px 12px;font-size:13px;font-weight:600;line-height:1.4;box-shadow:var(--shadow);z-index:2}
.petbubble::after{content:"";position:absolute;left:24px;bottom:-7px;width:12px;height:12px;background:var(--card);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg)}
.petdex{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
.petslot{aspect-ratio:1;border-radius:12px;background:rgba(127,127,127,.08);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:0;cursor:pointer}
.petslot img{width:100%;height:100%;object-fit:contain}
.petslot.on{border-style:solid;border-color:var(--mint)}
.petslot.lock img{filter:brightness(0);opacity:.72}          /* 未解锁=黑色剪影 */
.petslot.pick{outline:3px solid var(--mint);outline-offset:-1px}
.petslot.pick i{position:absolute;right:2px;bottom:1px;font-size:11px;color:#fff;background:var(--mint);border-radius:6px;padding:0 3px;line-height:1.3;font-style:normal}
.petprev{width:180px;height:180px;margin:6px auto 12px;display:flex;align-items:center;justify-content:center}
.petprev img{width:100%;height:100%;object-fit:contain}
.petprev.lock img{filter:brightness(0);opacity:.75}
.petprev-line{text-align:center;font-size:15px;font-weight:600;line-height:1.5;margin-bottom:14px;padding:0 10px}
.petlock{display:block;width:100%;text-align:center;padding:14px;margin-bottom:12px;border:1.5px dashed var(--line);border-radius:18px;background:var(--card2);color:var(--sub);font-weight:700;font-size:13.5px;cursor:pointer}
.petcorner{position:fixed;right:12px;bottom:82px;width:92px;height:92px;object-fit:contain;z-index:6;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.18))}
@media (max-width:380px){.petbubble{max-width:54%;font-size:12px}.petbig{width:84px;height:84px}.petcorner{width:78px;height:78px}}

<script>
const BOOK_STATS = {"b3000":{"units":59,"words":3000},"prep":{"units":8,"words":982},"basic":{"units":10,"words":1235},"core":{"units":19,"words":1125},"green":{"units":32,"words":1600},"a2":{"units":12,"words":490},"oxford":{"units":56,"words":5323},"a1":{"units":12,"words":601},"b1":{"units":13,"words":694},"b1p":{"units":13,"words":638},"b2":{"units":13,"words":565},"lis18":{"units":18,"words":1336},"liscene":{"units":10,"words":1389},"sat":{"units":25,"words":991}};
'use strict';
/* ================= 数据与常量 ================= */
const BOX_GAP = [0,1,2,4,7,15,30,60];      // 各强度等级到下次复习的天数
const MAXB = 7, MASTER = 5;                // box>=5 视为掌握, box7 烂熟不再复习

// ===== 乱序分支：每本书自动生成 <id>_r 变体（固定种子洗牌→每50词一单元，进度/同步完全独立）=====
const RAND_SEED = 20260718;                 // 改动会打乱既有乱序进度的对应关系，永远别改
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function seededShuffle(arr, seed){ const r=mulberry32(seed); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; } return arr; }
function buildVariantData(baseId){
  const base=__BOOK_DATA[baseId]; if(!base) return null;
  const all=[]; base.forEach(u=>u.words.forEach(w=>all.push(w)));
  seededShuffle(all, RAND_SEED);
  const units=[];
  for(let i=0;i<all.length;i+=50){
    const no=String(units.length+1).padStart(2,'0');
    units.push({id:'R'+no, name:'乱序 '+no, words:all.slice(i,i+50)});
  }
  return units;
}

// 词书规模（未加载时用拆分构建注入的 BOOK_STATS 清单；已加载用真实数据；乱序变体沿用本体词量）
function bookStat(b){
  const u=__BOOK_DATA[b.id];
  if (u) return {units:u.length, words:u.reduce((s,x)=>s+x.words.length,0)};
  if (b.variantOf){
    const baseB=BOOKS.find(x=>x.id===b.variantOf);
    const s=baseB?bookStat(baseB):{units:0,words:0};
    return {units:Math.ceil(s.words/50), words:s.words};
  }
  if (typeof BOOK_STATS!=='undefined' && BOOK_STATS[b.id]) return BOOK_STATS[b.id];
  return {units:0, words:0};
}

    WORDS.push({k, u:u.id, i, w:w[0], g:w[1], p:w[2]||''});

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return iso(new Date()); }
function addDays(ds,n){ const d=new Date(ds+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function posOf(g){ const m=String(g).match(/^\s*(n|vt|vi|v|adj|adv|prep|pron|conj|interj|num|aux|art)\b/i); return m?m[1].toLowerCase():''; }

function migrateOld(s, o){
  // 旧版是单元制：把单元轮次映射成词级强度
  if (!o || !o.u) return false;
  const stageBox = st => st.grad ? MASTER : Math.min(4, (st.stage||0)+1);
  let n = 0;
  for (const uid in o.u){
    const st = o.u[uid]; const unit = UNITS.find(x=>x.id===uid);
    if (!unit || !st) continue;
    const box = stageBox(st);
    const due = st.grad ? addDays(today(),30) : (st.due || today());
    unit.words.forEach((w,i)=>{
      const k = uid+':'+i;
      s.w[k] = { b:box, due, s:(st.stage||0)+1, ng:0, cs:1 };
      n++;
    });
    (st.wrongs||[]).forEach(i=>{ const k=uid+':'+i; if(s.w[k]){ s.w[k].ng=1; s.w[k].wb=1; s.w[k].cs=0; s.w[k].b=Math.max(1,box-1); } });
  }
  if (n === 0) return false;                 // 迁移失败时不留下任何旧痕迹
  if (o.wb) for (const k in o.wb){ if(s.w[k]){ s.w[k].wb=1; s.w[k].ng=Math.max(s.w[k].ng||0, o.wb[k].c||1); s.w[k].cs=0; } }
  if (o.log && typeof o.log==='object') s.log = o.log;
  if (o.cfg && o.cfg.theme) s.cfg.theme = o.cfg.theme;
  s.xp = Object.values(s.log).reduce((t,l)=>t+(Number(l&&l.q)||0)*2,0);
  return true;
}
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
function normalize(s){
  // 深度校验：导入/迁移的数据一律清洗成合法类型，杜绝坏数据落盘后反复崩溃或注入
  if (!s || typeof s!=='object') s={};
  const out={v:3};
  const w=(s.w&&typeof s.w==='object')?s.w:{};
  out.w={};
  // 词书数据未就绪时(拆分构建加载失败/未完成) WIDX 为空，此时不做词表过滤，
  // 仅做格式清洗——否则会把整份词态误删成空档（再被云同步扩散就是灾难）
  const widxReady = TOTAL > 0 || Object.keys(WIDX).length > 0;
  for (const k in w){
    if (widxReady ? !(k in WIDX) : !/^[A-Za-z0-9]+:\d+$/.test(k)) continue;
    const e=w[k];
    if (!e || typeof e!=='object' || Array.isArray(e)) continue;
    const x={ b:Math.min(MAXB,Math.max(0,Math.floor(Number(e.b)||0))),
      s:Math.max(0,Math.floor(Number(e.s)||0)),
      ng:Math.max(0,Math.floor(Number(e.ng)||0)),
      cs:Math.max(0,Math.floor(Number(e.cs)||0)),
      due:(typeof e.due==='string'&&DATE_RE.test(e.due))?e.due:null };
    if (e.st) x.st=1; if (e.z) x.z=1; if (e.wb) x.wb=1;
    if (typeof e.note==='string'&&e.note) x.note=e.note.slice(0,500);
    out.w[k]=x;
  }
  out.log={};
  const log=(s.log&&typeof s.log==='object')?s.log:{};
  for (const d in log){ const L=log[d];
    if (!DATE_RE.test(d)||!L||typeof L!=='object') continue;
    out.log[d]={n:Math.max(0,Number(L.n)||0), q:Math.max(0,Number(L.q)||0), w:Math.max(0,Number(L.w)||0), cb:Math.max(0,Number(L.cb)||0), m:Math.max(0,Number(L.m)||0)}; }
  out.ck={};
  const ck=(s.ck&&typeof s.ck==='object')?s.ck:{};
  for (const d in ck){ if (DATE_RE.test(d)&&ck[d]) out.ck[d]=1; }
  out.ach={};
  const ach=(s.ach&&typeof s.ach==='object')?s.ach:{};
  for (const id in ach){ if (ach[id]) out.ach[id]=String(ach[id]).slice(0,10); }
  out.xp=Math.max(0,Number(s.xp)||0);
  const b=(s.best&&typeof s.best==='object')?s.best:{};
  out.best={combo:Math.max(0,Number(b.combo)||0), spell:Math.max(0,Number(b.spell)||0), spellCur:Math.max(0,Number(b.spellCur)||0),
    llk:Number(b.llk)>0?Number(b.llk):0, llkClean:Number(b.llkClean)>0?Number(b.llkClean):0};
  const bp=bookPlan();
  const legacyPlan = s.plan && !(s.plan.mode==='unit'||s.plan.mode==='count');  // 旧版存档无 mode 字段
  const q=Number(s.plan&&s.plan.quota);
  const un=Number(s.plan&&s.plan.units);
  out.plan={
    mode:legacyPlan?bp.mode:((s.plan&&s.plan.mode)||bp.mode),
    quota:(!legacyPlan&&Number.isFinite(q)&&q>=1)?Math.min(500,Math.floor(q)):(bp.quota||50),  // 旧存档采用词书新默认（3000→50）
    units:(!legacyPlan&&Number.isFinite(un)&&un>=1)?Math.min(20,Math.floor(un)):(bp.units||1),
    start:(s.plan&&typeof s.plan.start==='string'&&UNITS.some(u=>u.id===s.plan.start))?s.plan.start:null};
  const t=s.today;
  out.today=(t&&typeof t==='object'&&typeof t.d==='string'&&Array.isArray(t.list)&&Array.isArray(t.done))
    ? {d:t.d, list:t.list.filter(k=>typeof k==='string'&&(k in WIDX)), done:t.done.filter(k=>typeof k==='string'&&(k in WIDX)), pv:t.pv?1:0}
    : null;
  const c=(s.cfg&&typeof s.cfg==='object')?s.cfg:{};
  out.cfg={theme:['auto','light','dark'].indexOf(c.theme)>=0?c.theme:'auto', voice:c.voice===2?2:1, auto:c.auto!==false, sfx:c.sfx!==false,
    pal:['mint','ink','mono','sand'].indexOf(c.pal)>=0?c.pal:'ink'};
  if (s.mig) out.mig=true;
  return out;
}
function load(){
  let s=null;
  try { const raw=store()&&store().getItem(KEY); if(raw) s=JSON.parse(raw); } catch(e){}
  if (!s){
    s=fresh();
    if (curBookId==='b3000'){                 // 旧版单元制存档只属于必会 3000
      for (const ok of OLDKEYS){
        try { const raw=store()&&store().getItem(ok);
          if (raw && migrateOld(s, JSON.parse(raw))){ s.mig=true; break; }
        } catch(e){}
      }
    }
  }
  return normalize(s);
}

function useBook(id, initial, cb){
  const b=BOOKS.find(x=>x.id===id)||BOOKS[0];
  if (!__BOOK_DATA[b.id]){
    if (b.variantOf){
      // 乱序变体：确保本体数据在，再本地推导（不需要额外数据文件）
      if (__BOOK_DATA[b.variantOf]){
        __BOOK_DATA[b.id]=buildVariantData(b.variantOf);
      } else {
        loadBookData(b.variantOf, ok=>{
          if (ok){ __BOOK_DATA[b.id]=buildVariantData(b.variantOf); useBook(id, initial, cb); }
        });
        return;
      }
      if (!__BOOK_DATA[b.id]) return;
    } else {
      loadBookData(b.id, ok=>{ if(ok) useBook(id, initial, cb); });
      return;
    }
  }
  curBookId=b.id;
  try { store() && store().setItem(BOOK_KEY, curBookId); } catch(e){}
  UNITS=__BOOK_DATA[b.id];
  buildWords();
  KEY=KEY_BASE+'__'+b.id;
  S=load();

    const bn=document.getElementById('brandName'); if(bn) bn.textContent=b.name;
    document.title=b.name+' | HY-LITE 环亚国际教育';
  } catch(e){}

    if (typeof SES!=='undefined'){ SES=null; FL=null; ML=null; }
    try { if (typeof advT!=='undefined') clearTimeout(advT); } catch(e){}       // 清掉残留的自动跳转倒计时
    try { if (typeof lisChainKs!=='undefined') lisChainKs=null; } catch(e){}    // 听力链词池不跨书
    screen=null; tab=0;
    applyTheme(); todayPlan(); render(); window.scrollTo(0,0); checkAch();
    toast('已切换到《'+b.name+'》');
    try { if (typeof syncOnBookSwitch==='function') syncOnBookSwitch(); } catch(e){}   // 云同步钩子
  }
  if (cb) cb();
}

function ws(k){ return S.w[k] || (S.w[k]={b:0,due:null,s:0,ng:0,cs:0}); }
function wsPeek(k){ return S.w[k]; }
function bumpOn(ds,key,n){ const L=S.log[ds]||(S.log[ds]={n:0,q:0,w:0}); L[key]=Math.max(0,(L[key]||0)+n); }

/* ================= 词态查询 ================= */
function isUnseen(W){ const st=wsPeek(W.k); return !st || (st.s===0 && !st.z); }
function statusOf(k){
  const st=wsPeek(k);
  if (!st || st.s===0) return st&&st.z ? 'zhan' : 'new';
  if (st.z) return 'zhan';
  if (st.b>=MASTER) return 'master';
  return 'learn';
}
function dueList(){
  const t=today(); const out=[];
  for (const W of WORDS){ const st=wsPeek(W.k);
    if (st && st.s>0 && !st.z && st.due && st.due<=t) out.push(W); }
  return out;
}
function aheadList(n){
  const t=today();
  const pool=WORDS.filter(W=>{ const st=wsPeek(W.k); return st&&st.s>0&&!st.z&&st.due&&st.due>t; });
  pool.sort((a,b)=> wsPeek(a.k).due < wsPeek(b.k).due ? -1 : 1);
  return pool.slice(0,n);
}
function weakList(n){
  const pool=WORDS.filter(W=>{ const st=wsPeek(W.k); return st&&st.s>0&&!st.z; });
  pool.sort((a,b)=> (wsPeek(a.k).b-wsPeek(b.k).b) || (wsPeek(b.k).ng-wsPeek(a.k).ng));
  return pool.slice(0,n);
}
function reviewPool(n){
  const d=shuffle(dueList());
  if (d.length>=n) return d.slice(0,n);
  return d.concat(aheadList(n-d.length));       // 到期不足时用最近要到期的词补足
}
function wbList(){ return WORDS.filter(W=>{ const st=wsPeek(W.k); return st&&st.wb&&!st.z; }); }
function starList(){ return WORDS.filter(W=>{ const st=wsPeek(W.k); return st&&st.st&&!st.z; }); }
function zhanList(){ return WORDS.filter(W=>{ const st=wsPeek(W.k); return st&&st.z; }); }
function counts(){
  let learn=0, master=0, zhan=0, seen=0;
  for (const k in S.w){ const st=S.w[k];
    if (st.z){ zhan++; continue; }
    if (st.s>0){ seen++; if (st.b>=MASTER) master++; else learn++; } }
  return {learn, master, zhan, seen, fresh: TOTAL-seen-zhan};
}

/* ================= 每日计划 ================= */
function pickNew(n, excl){
  const ex=new Set(excl||[]); const out=[];
  let start=0;
  if (S.plan.start && (S.plan.start+':0') in WIDX) start=WIDX[S.plan.start+':0'];  // 学习起点，回绕遍历
  for (let j=0; j<WORDS.length && out.length<n; j++){
    const W=WORDS[(start+j)%WORDS.length];
    if (!isUnseen(W) || ex.has(W.k)) continue; out.push(W.k);
  }
  return out;
}
// 单元模式：取前 n 个「还有未学词」的单元里的全部未学词（B1/B1+ 一天一个单元）
function unitFresh(u){ return u.words.map((w,i)=>u.id+':'+i).filter(k=>isUnseen(WORDS[WIDX[k]])); }
function nextUnits(n, exclUnits){
  const ex=new Set(exclUnits||[]); const out=[]; let taken=0;
  for (const u of UNITS){
    if (ex.has(u.id)) continue;
    const fr=unitFresh(u);
    if (!fr.length) continue;
    out.push(...fr); taken++;
    if (taken>=n) break;
  }
  return out;
}
function unitsOfKeys(keys){ const s=[]; keys.forEach(k=>{ const u=k.split(':')[0]; if(!s.includes(u)) s.push(u); }); return s; }
function planNewKeys(){
  return S.plan.mode==='unit' ? nextUnits(S.plan.units||1) : pickNew(S.plan.quota);
}
function todayPlan(){
  const t=today();
  if (!S.today || S.today.d!==t){ S.today={d:t, list:planNewKeys(), done:[], pv:0}; save(); }
  else {
    // 剔除已被斩的、以及词表变更后失效的 key
    S.today.list = S.today.list.filter(k=>{ if(!(k in WIDX)) return false; const st=wsPeek(k); return !(st&&st.z); });
    S.today.done = S.today.done.filter(k=>S.today.list.includes(k));
    if (S.plan.mode==='unit'){
      // 每天固定 units 个单元；仅当把每日单元数「调大」时补入更多单元。
      // list 为空（当天单元被全部斩掉/清空）不补——否则会误顺延到下一单元；学完不自动顺延，明天或「加餐」再来。
      const curUnits=unitsOfKeys(S.today.list);
      if (S.today.list.length && curUnits.length < (S.plan.units||1)){
        const add=nextUnits((S.plan.units||1)-curUnits.length, curUnits);
        if (add.length) S.today.list=S.today.list.concat(add);
      }
    } else {
      // 计划调大时补充，调小时裁剪未学部分
      if (S.today.list.length < S.plan.quota){
        S.today.list = S.today.list.concat(pickNew(S.plan.quota - S.today.list.length, S.today.list));
      } else if (S.today.list.length > S.plan.quota){
        const keep = S.today.list.filter(k=>S.today.done.includes(k));
        const rest = S.today.list.filter(k=>!S.today.done.includes(k));
        S.today.list = keep.concat(rest.slice(0, Math.max(0, S.plan.quota-keep.length)));
      }
    }
    // 别处学过但没记 done 的补记
    S.today.list.forEach(k=>{ const st=wsPeek(k); if (st&&st.s>0&&!S.today.done.includes(k)) S.today.done.push(k); });
  }
  return S.today;
}
function tryCheckin(){
  const t=today();
  if (S.ck[t]) return false;
  const tp=todayPlan();
  const planDone = tp.list.length===0 || tp.done.length>=tp.list.length;
  const active = (S.log[t]&&S.log[t].q>0) || (S.log[t]&&S.log[t].n>0);
  if (planDone && active){
    S.ck[t]=1; addXp(20); save();
    toast('🎉 打卡成功 · 连续 '+streak()+' 天'); sfx('ck'); confetti();
    try { if (typeof petFeed==='function') petFeed('checkin'); } catch(e){}
    checkAch(); return true;
  }
  return false;
}
function streak(){
  let n=0; const d=new Date();
  if (!S.ck[iso(d)]) d.setDate(d.getDate()-1);
  while (S.ck[iso(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function applyAnswer(k, ok){
  const st=ws(k); const wasNew = st.s===0;
  const wasMaster=(st.b||0)>=MASTER;
  try {
    if (typeof petFeed==='function' && !window._noPet){     // 速刷路径不喂宠物(可撤销，避免刷经验)
      if (wasNew) petFeed('learn');                         // 学新词=喂宠物
      if (ok && !wasMaster && (st.b||0)+1>=MASTER) petFeed('master');   // 刚掌握
    }
  } catch(e){}
  st.s++;
  bump('q',1);
  if (wasNew) bump('n',1);
  if (ok){
    st.cs=(st.cs||0)+1; if (st.cs>=2) st.wb=0;
    st.b=Math.min(MAXB,(st.b||0)+1);
    st.due = st.b>=MAXB ? null : addDays(today(), BOX_GAP[st.b]);
  } else {
    st.ng=(st.ng||0)+1; st.cs=0; st.wb=1;
    st.b=Math.max(0,(st.b||0)-2);
    st.due=today();
    bump('w',1);
  }
  const isMaster=st.b>=MASTER;                       // 当日熟练量净增减
  if (isMaster&&!wasMaster) bump('m',1);
  else if (wasMaster&&!isMaster) bump('m',-1);
  if (wasNew && S.today && S.today.d===today() && S.today.list.includes(k) && !S.today.done.includes(k)) S.today.done.push(k);
  save();
}

let ttsVoice=null;
function initTTS(){
  try {
    if (!('speechSynthesis' in window)) return;
    const pick=()=>{ const vs=speechSynthesis.getVoices();
      ttsVoice = vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; };
    pick();
    speechSynthesis.onvoiceschanged=pick;
  } catch(e){}
}
let curAudio=null;
function stopSpeak(){                                          // 打断上一条发音，避免多路叠音
  try { if (curAudio){ curAudio.pause(); curAudio=null; } } catch(e){}
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
}
// 朗读文本清洗：去掉用法标注（括号/方括号），斜杠多变体取第一个——
// "turn (to the) left / right" 只读 "turn left"，避免把标点读出来
function speakText(w){
  const t = String(w)
    .replace(/（[^）]*）|\([^)]*\)|\[[^\]]*\]/g, ' ')
    .split('/')[0]
    .replace(/\s+/g, ' ').trim();
  return t || String(w);
}
function say(w, voice){
  w = speakText(w);
  const v = voice || S.cfg.voice || 1;
  stopSpeak();
  try {
    const a=new Audio('https://dict.youdao.com/dictvoice?type='+v+'&audio='+encodeURIComponent(w));
    curAudio=a;
    let done=false;
    const fb=()=>{ if(done||curAudio!==a) return; done=true; tts(w,v); };  // 有道拉不到就用系统语音兜底；已被新发音替换则作废
    a.addEventListener('playing', ()=>{ done=true; });        // 真发声了
    a.addEventListener('error', fb);
    const p=a.play();
    if (p && p.catch) p.catch(fb);
    setTimeout(()=>{ if(!done) fb(); }, 1400);                // 1.4s 内没出声就兜底
  } catch(e){ tts(w,v); }
}
function tts(w,v){
  try {
    if (!('speechSynthesis' in window)) return;
    const u=new SpeechSynthesisUtterance(w);
    const vs=speechSynthesis.getVoices();
    const voice = (v===2 ? vs.find(x=>/en[-_]US/i.test(x.lang)) : vs.find(x=>/en[-_]GB/i.test(x.lang)))
      || vs.find(x=>/^en/i.test(x.lang)) || ttsVoice;
    if (voice) u.voice=voice;
    u.lang = v===2?'en-US':'en-GB'; u.rate=.9;
    speechSynthesis.cancel();
    try { speechSynthesis.resume(); } catch(_){}
    speechSynthesis.speak(u);
  } catch(e){}
}
let AC=null;
function sfx(kind){
  if (!S.cfg.sfx) return;
  try {
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if (AC.state==='suspended') AC.resume();
    const notes = kind==='ok' ? [[660,0,.08],[880,.07,.1]]
      : kind==='ng' ? [[170,0,.18]]
      : kind==='pick' ? [[520,0,.06]]
      : kind==='ck' ? [[523,0,.1],[659,.09,.1],[784,.18,.16]] : [];
    notes.forEach(([f,t,d])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type = kind==='ng'?'square':'sine'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001, AC.currentTime+t);
      g.gain.exponentialRampToValueAtTime(kind==='ng'?.06:.09, AC.currentTime+t+.01);
      g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime+t+d);
      o.connect(g).connect(AC.destination);
      o.start(AC.currentTime+t); o.stop(AC.currentTime+t+d+.02);
    });
  } catch(e){}
}

function toast(msg){

  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  w.appendChild(el);
  setTimeout(()=>el.classList.add('out'), 1900);

let fxT=null;
function confetti(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('#fx'); if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const cols=['#31C79A','#FFB454','#5CC8FF','#FF6B6B','#E8DE6A'];
  const ps=Array.from({length:90},()=>({
    x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.4,
    vx:(Math.random()-.5)*2.2, vy:2.2+Math.random()*3.2,
    r:3+Math.random()*4, a:Math.random()*6.28, va:(Math.random()-.5)*.3,
    c:cols[Math.floor(Math.random()*cols.length)]
  }));
  const t0=performance.now();
  cancelAnimationFrame(fxT);
  (function tick(t){
    const el=(t-t0)/1000;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    if (el>2.2) return;
    for (const p of ps){
      p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.globalAlpha=Math.max(0,1-el/2.2);
      ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
      ctx.restore();
    }
    fxT=requestAnimationFrame(tick);
  })(t0);
}

/* ================= 选项生成 ================= */
function optionsFor(W, kind){ // kind 'g': 选释义；'w': 选单词
  const p=posOf(W.g);
  const picked=[]; const seenK=new Set([W.k]); const seenT=new Set([kind==='g'?W.g:W.w.toLowerCase()]);
  // 听力词书选释义时排除近义干扰项(场景书里"在左边/在左侧"这类同屏必误判)：
  // 归一化释义(去词性前缀/标点)后，与正确项前两字相同的候选跳过
  const normG = s=>String(s).replace(/^[a-zA-Z\.,;&()\s]+/, '').replace(/^[，。、；]+/, '').slice(0,2);
  const corr2 = (kind==='g' && curBook().listen) ? (normG(W.g).length>=2 ? normG(W.g) : null) : null;
  const take=x=>{
    const t = kind==='g'?x.g:x.w.toLowerCase();
    if (seenK.has(x.k)||seenT.has(t)) return;
    if (corr2 && normG(x.g)===corr2) return;
    seenK.add(x.k); seenT.add(t); picked.push(x);
  };
  const tiers=[
    WORDS.filter(x=>x.u===W.u && posOf(x.g)===p),
    WORDS.filter(x=>posOf(x.g)===p),
    WORDS
  ];
  for (const tier of tiers){ if (picked.length>=3) break;
    for (const x of shuffle(tier.slice())){ if (picked.length>=3) break; take(x); } }
  return shuffle([W, ...picked]);
}

  let pool=reviewPool(20);
  if ((t==='dt'||t==='sp')){
    const sp=pool.filter(W=>spellable(W.w));
    if (sp.length) pool=sp;          // 优先可拼写的词；全是短语类则退回原池（sp题看着拼还行）
    else if (t==='dt' && !listenDrill){ toast('学过的词里暂时没有适合听写的，先练听音辨义吧'); return; }
    else if (t==='dt') pool=[];      // 听力书：交给下面的未学词补足
  }
  let steps=pool.map(W=>({k:W.k, t}));
  // 听力书拿起来就能听：学过的词不足 20 个时，用未学的词按书序补足（预习模式，不动记忆曲线）
  if (listenDrill && steps.length<20){
    const have=new Set(pool.map(W=>W.k));
    for (const W of WORDS){
      if (steps.length>=20) break;
      const st=wsPeek(W.k);
      if (have.has(W.k) || (st&&(st.s>0||st.z))) continue;
      if (t==='dt' && !spellable(W.w)) continue;
      steps.push({k:W.k, t, light:1});
    }
  }
  if (!steps.length){ toast(t==='dt'?'这本书暂时没有适合听写的词':'还没有可练的词，先学新词吧'); return; }
  beginSession('mode', steps, dest);
}
function startWrongs(){
  const pool=shuffle(wbList().slice()).slice(0,20);
  if (!pool.length){ toast('错词本是空的，很棒'); return; }
  // 听力词书的错词复练仍走听音题——测的就是"听到没懂"那条通路
  beginSession('wrongs', pool.map(W=>({k:W.k, t: curBook().listen ? pickType((wsPeek(W.k)||{}).b||0, W.w) : 'ec'})));
}
function startStars(){
  const pool=shuffle(starList().slice()).slice(0,20);
  if (!pool.length){ toast('生词本是空的，先去收藏几个词'); return; }
  beginSession('stars', pool.map(W=>({k:W.k, t:pickType((wsPeek(W.k)||{}).b||0, W.w)})));
}
function startUnitLearn(id){
  const u=UNITS.find(x=>x.id===id); const ks=[];
  u.words.forEach((w,i)=>{ const k=id+':'+i; if (isUnseen(WORDS[WIDX[k]])) ks.push(k); });
  if (!ks.length){ toast('本单元没有未学的词'); return; }
  pvCover=false;
  screen={type:'learn', ks, cont:'unit'};
  render(); window.scrollTo(0,0);
}
function startUnitQuiz(id){
  const u=UNITS.find(x=>x.id===id); const pool=[];
  u.words.forEach((w,i)=>{ const k=id+':'+i; const st=wsPeek(k); if (st&&st.s>0&&!st.z) pool.push(k); });
  if (!pool.length){ toast('本单元还没学过的词，先学新词'); return; }
  beginSession('unit', shuffle(pool).map(k=>({k, t:pickType(wsPeek(k).b, WORDS[WIDX[k]].w)})));
}
function beginSession(kind, steps, dest){
  steps=steps.filter(s=>s.k in WIDX);
  if (!steps.length){ toast('没有可练的词'); return; }
  SES={kind, steps, pos:0, ok:0, ng:0, newN:0, combo:0, maxCombo:0, rq:{}, xp0:S.xp, dest:(dest!=null?dest:null)};
  screen={type:'session'}; render(); window.scrollTo(0,0);
}
function starCur(){
  const q=SES; if (!q) return;
  const st=q.steps[q.pos]; if (st) toggleStar(st.k);
}
function zhanCur(){
  const q=SES; if (!q) return;
  const st=q.steps[q.pos]; if (!st) return;
  const k=st.k, w=ws(k);
  w.z=1; if (w.s===0) w.s=1; save();
  toast('⚔ 已斩 · 此词不再出现（可在「已斩词」恢复）'); sfx('ok'); checkAch();
  q.steps=q.steps.filter((s,i)=>i<=q.pos || s.k!==k);
  if (lisChainKs) lisChainKs=lisChainKs.filter(x=>x!==k);   // 特训池同步剔除
  sNext();
}
function requeue(st){
  // 听力词书的听音题：错了不当场重出，看完正确答案就往下走——巩固交给遗忘曲线，下次复习自动再现
  if (curBook().listen && (st.t==='ls'||st.t==='dt')) return;
  const q=SES; q.rq[st.k]=(q.rq[st.k]||0)+1;
  if (q.rq[st.k]<=2) q.steps.push({k:st.k, t:st.t, drill:1});
}
function exitSession(){
  if (SES && SES.pos<SES.steps.length){
    ask('退出本次训练？\n已作答的进度会保留。', doExitSession, '退 出');
    return;
  }
  doExitSession();
}
function doExitSession(){
  clearTimeout(advT); SES=null; screen=null; lisChainKs=null; render(); window.scrollTo(0,0);
}
function sNext(){
  clearTimeout(advT);
  if (!SES) return;
  SES.pos++; render(); window.scrollTo(0,0);
}
function sAnswer(oi){
  const q=SES; if (!q) return;
  const st=q.steps[q.pos]; if (st.ans!=null) return;
  const W=WORDS[WIDX[st.k]];
  const ok = st.opts[oi].k===W.k;
  st.ans=oi; st.ok=ok;
  gradeStep(st, W, ok);
  if (st.t!=='ec' || !ok) say(W.w);
  render();
  if (ok && !needDetail(st)) advT=setTimeout(sNext, 550);
}
function gradeStep(st, W, ok){
  if (st.light){
    // 听力特训巩固步：不动 SRS/错词本，只给少量经验和连击反馈
    if (ok){ SES.ok++; SES.combo++; SES.maxCombo=Math.max(SES.maxCombo,SES.combo); addXp(1); }
    else { SES.ng++; SES.combo=0; }
    save(); sfx(ok?'ok':'ng');
    return;
  }
  if (!st.drill){
    applyAnswer(W.k, ok);
    if (st.nw) SES.newN++;
    if (ok){
      SES.ok++; SES.combo++; SES.maxCombo=Math.max(SES.maxCombo,SES.combo);
      if (SES.combo>(S.best.combo||0)) S.best.combo=SES.combo;
      const L=S.log[today()]; if (L) L.cb=Math.max(L.cb||0, SES.combo);   // 当日最高连击
      addXp(2 + (SES.combo>0 && SES.combo%10===0 ? 5 : 0));
      if (SES.combo>0 && SES.combo%10===0){ try { if (typeof petFeed==='function') petFeed('combo'); } catch(e){} }  // 每 10 连击也喂宠物
    } else { SES.ng++; SES.combo=0; addXp(1); }
    save();
  }
  if (!ok) requeue(st);
  sfx(ok?'ok':'ng');
  checkAch();
}
function needDetail(st){ return st.ok===false; }   // 只有答错才停下纠正；答对一律直接走

/* ---------- 拼写 ---------- */
function spCheck(){
  const q=SES; if (!q) return;
  const st=q.steps[q.pos]; if (st.ans!=null) return;
  const W=WORDS[WIDX[st.k]];
  const inp=$('#spin'); if (!inp) return;
  // 判定前归一化：弯撇号→直撇号、连续空格合一（iOS 智能标点/多敲空格不冤枉人）
  const spNorm=s=>String(s).replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim().toLowerCase();
  const val=spNorm(inp.value);
  if (!val) return;
  const ok = val===spNorm(W.w);
  st.tries=(st.tries||0)+1;
  st.typed=val;
  if (ok){
    st.ans=1; st.ok=true;
    if (!st.drill){                                        // 巩固步不计入拼写连对纪录
      S.best.spellCur=(S.best.spellCur||0)+1;
      S.best.spell=Math.max(S.best.spell||0, S.best.spellCur);
    }
    gradeStep(st, W, true); say(W.w); render();
    if (!needDetail(st)) advT=setTimeout(sNext, 600);
  } else if (st.tries>=2){
    st.ans=1; st.ok=false; if (!st.drill) S.best.spellCur=0;
    gradeStep(st, W, false); say(W.w); render();
  } else {
    if (!st.drill) S.best.spellCur=0;
    save();
    sfx('ng'); render();
    if (st.t==='dt') say(W.w);          // 听写第一次拼错多半是没听清，自动重播一遍
    const i2=$('#spin'); if (i2){ i2.value=''; i2.focus(); }
  }
}
function spSlots(W, typed, final){
  const t=W.w; let h='<div class="slots">';
  for (let i=0;i<t.length;i++){
    const ch=t[i]===' ' ? '&nbsp;' : esc(t[i]);
    if (final) h+=`<span class="slot ${typed && typed[i]===t[i].toLowerCase()?'hit':'miss'}">${ch}</span>`;
    else h+=`<span class="slot">${typed&&typed[i]?esc(typed[i]):''}</span>`;
  }
  return h+'</div>';
}

/* ---------- 会话渲染 ---------- */
function rSession(){
  const q=SES;
  if (q.pos>=q.steps.length) return rSessionEnd();
  const st=q.steps[q.pos]; const W=WORDS[WIDX[st.k]];
  if (!st.opts && st.t!=='sp' && st.t!=='dt') st.opts=optionsFor(W, st.t==='ce'?'w':'g');
  const answered=st.ans!=null;
  const starred=!!(wsPeek(st.k)&&wsPeek(st.k).st);
  let h=`<div class="stop">
    <button class="x" onclick="exitSession()" aria-label="退出">✕</button>
    <div class="sprog"><i style="width:${Math.round(q.pos/q.steps.length*100)}%"></i></div>
    <span class="combo num">${q.combo>1?'⚡ ×'+q.combo:''}</span>
    <button class="x" onclick="starCur()" title="标记生难词，收入生词本" aria-label="标记生难词" ${starred?'style="color:var(--amber);border-color:var(--amber)"':''}>${starred?'★':'☆'}</button>
    <button class="x" onclick="zhanCur()" title="斩掉这个词，不再出现" aria-label="斩掉这个词">⚔</button></div>`;
  h+=`<div class="qask">${st.drill?'巩固 · ':''}${st.nw?'新词 · ':''}${typeName(st.t)}</div>`;

  if (st.t==='ec'){
    h+=`<div class="qword" data-say="${A(W.w)}">${esc(W.w)}</div>
        <div class="qphon">${W.p?'/'+esc(W.p)+'/':''}</div>`;
    h+=rOpts(st, W, 'g');
  } else if (st.t==='ce'){
    h+=`<div class="gmeaning">${esc(W.g)}</div>`;
    h+=rOpts(st, W, 'w');
  } else if (st.t==='ls'){
    if (!answered) h+=`<button class="bigsay" data-say="${A(W.w)}" aria-label="播放发音"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor" stroke="none"/><path d="M15.5 7a6.5 6.5 0 0 1 0 10M18 4.5a10 10 0 0 1 0 15"/></svg></button>
      <div class="muted" style="text-align:center">听发音，选出词义 · 没听到就点大喇叭</div>`;
    else h+=`<div class="qword reveal" data-say="${A(W.w)}">${esc(W.w)}</div><div class="qphon">${W.p?'/'+esc(W.p)+'/':''}</div>`;
    h+=rOpts(st, W, 'g');
  } else if (st.t==='sp' || st.t==='dt'){
    if (st.t==='sp'){
      h+=`<div class="gmeaning">${esc(W.g)}</div>
          <div class="qphon" style="margin-top:6px">${W.p?'/'+esc(W.p)+'/':''}</div>`;
    } else {
      h+=`<button class="bigsay" data-say="${A(W.w)}" aria-label="播放发音" style="margin-top:14px"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z" fill="currentColor" stroke="none"/><path d="M15.5 7a6.5 6.5 0 0 1 0 10M18 4.5a10 10 0 0 1 0 15"/></svg></button>`;
      if (!answered) h+=`<div class="muted" style="text-align:center">听发音，拼出这个单词 · 没听到就点大喇叭</div>`;
      if (st.tries && !answered) h+=`<div class="gmeaning reveal" style="font-size:15px;padding-top:8px">${esc(W.g)}</div>`;
    }
    if (!answered){
      h+=spSlots(W, '', false);
      h+=`<input id="spin" class="spellin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="拼出这个单词" onkeydown="if(event.key==='Enter'&&!event.repeat)spCheck()">`;
      if (st.tries) h+=`<div class="muted" style="text-align:center;margin-top:8px">再试一次 · 首字母 <b>${esc(W.w[0])}</b> · 共 ${W.w.replace(/[^A-Za-z]/g,'').length} 个字母${W.w.includes(' ')?` · ${W.w.trim().split(/\s+/).length} 个词`:''}</div>`;
      h+=`<button class="b3d" onclick="spCheck()">检 查</button>`;
    } else {
      if (st.t==='dt') h+=`<div class="gmeaning" style="padding-top:6px;font-size:15px">${esc(W.g)}</div>`;
      h+=spSlots(W, st.ok ? W.w.toLowerCase() : st.typed, true);
      if (!st.ok) h+=`<div class="muted" style="text-align:center">你拼的是：${esc(st.typed||'—')} · 正确拼写见上（红色为拼错的位置）</div>`;
    }
  }

  if (answered && needDetail(st)) h+=rDetail(W);
  if (answered && (st.t==='sp' || needDetail(st) || !st.ok)) h+=`<button class="b3d snext" onclick="sNext()">下一词</button>`;
  const kh = (st.t==='sp'||st.t==='dt')
    ? (answered ? `<kbd>回车</kbd> 继续` : `<kbd>回车</kbd> 检查${st.t==='dt'?'　点喇叭重播':''}`)
    : `<kbd>1</kbd>–<kbd>4</kbd> 选项　<kbd>空格</kbd> 发音　<kbd>回车</kbd> 继续`;
  h+=`<div class="khint">${kh}</div>`;
  if (typeof petCornerHtml==='function'){ try { h+=petCornerHtml(); } catch(e){} }   // 右下角小表情挂件
  $('#app').innerHTML=h;
  const inp=$('#spin'); if (inp) inp.focus();
  if (!answered){
    if (st.t==='ec' && S.cfg.auto && st.said!==1){ st.said=1; say(W.w); }
    if ((st.t==='ls' || st.t==='dt') && st.said!==1){ st.said=1; say(W.w); }
  }
}
function rOpts(st, W, kind){
  const answered=st.ans!=null;
  let h='<div class="opts">';
  st.opts.forEach((o,i)=>{
    let cls='opt';
    if (answered){
      if (o.k===W.k) cls+=' right';
      else if (i===st.ans) cls+=' wrong';
      else cls+=' dim';
    }
    const label = kind==='g' ? o.g : o.w;
    h+=`<button class="${cls}" onclick="sAnswer(${i})" ${answered?'disabled':''}><span class="kno">${i+1}</span>${esc(label)}</button>`;
  });
  return h+'</div>';
}
function rDetail(W){
  const st=wsPeek(W.k)||{};
  return `<div class="detail reveal">
    <div class="spread"><div><span class="dw">${esc(W.w)}</span> <span class="dp">${W.p?'/'+esc(W.p)+'/':''}</span></div></div>
    <div class="dg">${esc(W.g)}</div>
    ${st.note?`<div class="muted" style="margin-top:6px">📝 ${esc(st.note)}</div>`:''}
    <div class="dbtns">
      <button data-say="${A(W.w)}">${SPK} 英音</button>
      <button data-say2="${A(W.w)}">${SPK} 美音</button>
      <button class="${st.st?'on':''}" onclick="toggleStar('${W.k}');render()"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>${st.st?'已收藏':'生词本'}</button>
      <button class="${st.z?'zon':''}" onclick="toggleZhan('${W.k}')"><svg viewBox="0 0 24 24"><path d="M4 20 20 4M9.5 4.5 20 15M4 15l5 5"/></svg>${st.z?'已斩·撤销':'斩'}</button>
    </div></div>`;
}
function rSessionEnd(){
  clearTimeout(advT);
  const q=SES;
  const acc = (q.ok+q.ng) ? Math.round(q.ok/(q.ok+q.ng)*100) : 100;
  try { if (typeof petAfterSession==='function' && !q._petDone){ q._petDone=1; petAfterSession(acc, q.newN); } } catch(e){}
  const gained = S.xp-q.xp0;
  let h=`<div class="endwrap">
    <div style="font-size:52px;line-height:1">${acc>=90?'🏆':acc>=70?'💪':'📖'}</div>
    <h2>${q.kind==='task'?'今日任务完成':'训练完成'}</h2>
    <div class="sub">正确率 ${acc}%</div>
    <div class="endstats">
      <div><div class="n num">${q.newN}</div><div class="l">新学</div></div>
      <div><div class="n num">${q.ok+q.ng-q.newN}</div><div class="l">复习</div></div>
      <div><div class="n am num">×${q.maxCombo}</div><div class="l">最高连击</div></div>
      <div><div class="n num">+${gained}</div><div class="l">经验</div></div>
    </div></div>`;
  const wrongs=[...new Set(q.steps.filter(s=>!s.drill&&!s.light&&s.ok===false).map(s=>s.k))];
  const lisWrongs=[...new Set(q.steps.filter(s=>s.light&&s.ok===false).map(s=>s.k))];
  if (lisWrongs.length){
    h+=`<div class="sec">没听出来的词 · 建议点开再听几遍</div><div class="card">`;
    lisWrongs.forEach(k=>{ const W=WORDS[WIDX[k]]; h+=wRow(W); });
    h+=`</div>`;
  }
  if (wrongs.length){
    h+=`<div class="sec">本轮错词 · 已进错词本</div><div class="card">`;
    wrongs.forEach(k=>{ const W=WORDS[WIDX[k]]; h+=wRow(W); });
    h+=`</div>`;
  }
  if (q.kind==='wrongs' && wbList().length) h+=`<button class="b3d red" onclick="startWrongs()">再抽一批错词 · ${Math.min(20,wbList().length)} 词</button>`;
  if (q.kind==='mode' && q.steps.length) h+=`<button class="b3d line" onclick="startMode('${q.steps[0].t}', ${q.dest!=null?q.dest:'null'})">再来一组</button>`;

  // 听力词书：任务完成后自动进入听力特训两关（听音辨义 → 听音拼写）
  const lisNext = curBook().listen ? (q.kind==='task' ? 1 : q.kind==='lis1' ? 2 : 0) : 0;
  if (lisNext){
    // 练习池只算一次并固定（点星标等重渲染不再重洗牌）：今天学过的全部词 ∪ 刚才会话的词
    if (!q.lisKs){
      const doneToday = (S.today && S.today.d===today() && S.today.done) || [];
      q.lisKs = q.kind==='task'
        ? shuffle([...new Set([...doneToday, ...q.steps.map(s=>s.k)])]).slice(0,30)
        : (lisChainKs || []);
    }
    const ks = q.lisKs;
    if (ks && ks.length){
      lisChainKs = ks;
      h+=`<div class="card" style="text-align:center;margin-top:12px">
        <div style="font-weight:800;letter-spacing:1px">🎧 听力特训 第${lisNext}关</div>
        <div class="muted" style="margin-top:4px">${lisNext===1?'听音辨义 · 听到就要认出意思':'听音拼写为主 · 拼不了的短语出辨义'}，3 秒后自动开始</div></div>
        <button class="b3d" onclick="startLisChain(${lisNext}, lisChainKs)">立即开始</button>
        <button class="b3d ghost" onclick="clearTimeout(advT);SES=null;screen=null;lisChainKs=null;go(0)">今天先到这，跳过</button>`;
      $('#app').innerHTML=h;
      tryCheckin(); checkAch();
      // 词卡弹层打开时暂停倒计时（关闭弹层重渲染时会重新计时）
      let modalOpen=false; try { modalOpen=$('#modal').classList.contains('show'); } catch(e){}
      if (!modalOpen) advT=setTimeout(()=>{ startLisChain(lisNext, lisChainKs); }, 3000);
      return;
    }
  }
  if (q.kind==='lis2'){ h=h.replace('训练完成','🎧 听力特训完成'); lisChainKs=null; }

  h+=`<button class="b3d" onclick="SES=null;screen=null;go(${q.dest!=null?q.dest:endDest(q.kind)})">完 成</button>`;
  $('#app').innerHTML=h;
  tryCheckin(); checkAch();
}

/* ================= 速刷 ================= */
function startFlash(dest){
  const pool=reviewPool(30);
  if (!pool.length){ toast('还没有学过的词，先学新词吧'); return; }
  FL={cards:shuffle(pool.slice()), pos:0, showG:false, hist:[], ok:0, ng:0, xp0:S.xp, dest:(dest!=null?dest:1)};
  screen={type:'flash'}; render(); window.scrollTo(0,0);
}
function flAnswer(ok){
  const q=FL; if (!q || q.pos>=q.cards.length) return;
  const W=q.cards[q.pos];
  const prev=S.w[W.k] ? JSON.parse(JSON.stringify(S.w[W.k])) : null;
  const wasNew = !prev || prev.s===0;
  const wasMaster = !!prev && (prev.b||0)>=MASTER;
  const h={k:W.k, prev, ok, wasNew, pos:q.pos, d:today()};
  q.hist.push(h);
  window._noPet=1; applyAnswer(W.k, ok); window._noPet=0;   // 速刷可撤销，不喂宠物防刷经验
  h.md = ((S.w[W.k].b>=MASTER)?1:0) - (wasMaster?1:0);   // 熟练量净变化，撤销时反向冲销
  if (ok){ q.ok++; addXp(2); } else { q.ng++; addXp(1); }
  save(); sfx(ok?'ok':'ng');
  if (ok){ q.pos++; q.showG=false; } else { q.showG=true; say(W.w); }
  render();
}
function flUndo(){
  const q=FL; if (!q || !q.hist.length) return;
  const h=q.hist.pop();

}

/* ================= 连连看 ================= */
function startMatch(dest){
  const pool=WORDS.filter(W=>{ const st=wsPeek(W.k); return st&&st.s>0&&!st.z; });
  if (pool.length<5){ toast('学过 5 个词后开放连连看'); return; }
  const seenG=new Set(); const pairs=[];
  for (const W of shuffle(pool.slice())){            // 释义文本去重，避免两个格子长一样
    if (seenG.has(W.g)) continue;
    seenG.add(W.g); pairs.push(W);
    if (pairs.length>=5) break;
  }
  if (pairs.length<5){ toast('可用词不足 5 个'); return; }
  ML={dest:(dest!=null?dest:1), pairs, ws:shuffle(pairs.slice()), gs:shuffle(pairs.slice()), sel:null,
      done:new Set(), miss:0, t0:performance.now(), fin:0};
  screen={type:'match'}; render(); window.scrollTo(0,0);
  mTick();
}
function mTick(){
  if (!ML || ML.fin) return;
  const el=$('#mt'); if (el) el.textContent=((performance.now()-ML.t0)/1000).toFixed(1)+'s';
  requestAnimationFrame(mTick);
}
function mPick(side, i){
  const q=ML; if (!q || q.fin) return;
  const item = side==='w' ? q.ws[i] : q.gs[i];
  if (q.done.has(item.k)) return;
  sfx('pick');
  if (!q.sel){ q.sel={side, i, k:item.k}; render(); return; }
  if (q.sel.side===side){ q.sel={side, i, k:item.k}; render(); return; }
  if (q.sel.k===item.k){
    q.done.add(item.k); q.sel=null; sfx('ok');
    if (q.done.size===q.pairs.length) mFinish();
    render();
  } else {
    q.miss++; const a=q.sel; q.sel=null; sfx('ng');
    render();
    const c1=$('#m_'+a.side+'_'+a.i), c2=$('#m_'+side+'_'+i);
    if (c1) c1.classList.add('bad'); if (c2) c2.classList.add('bad');
  }
}
function mFinish(){
  const q=ML; q.fin=1;
  q.time=Math.round((performance.now()-q.t0)/100)/10;
  if (!S.best.llk || q.time<S.best.llk) S.best.llk=q.time;
  if (q.miss===0 && (!S.best.llkClean || q.time<S.best.llkClean)) S.best.llkClean=q.time;
  bump('q',5); addXp(10); save();
  sfx('ck'); checkAch(); tryCheckin();
}
function rMatch(){
  const q=ML;
  let h=`<div class="stop">
    <button class="x" onclick="ML=null;screen=null;render()" aria-label="退出">✕</button>
    <div class="mtimer num" id="mt" style="flex:1">0.0s</div>

  if (q.fin){

      <h2 class="num">${q.time}s</h2>
      <div class="sub">失误 ${q.miss} 次 · 最佳 ${S.best.llk||q.time}s${S.best.llkClean?' · 零失误最佳 '+S.best.llkClean+'s':''}</div>
      <div class="row2"><button class="b3d" onclick="startMatch()">再来一局</button>
