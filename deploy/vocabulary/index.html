'use strict';
/* ================= 云同步（可选功能，未登录时完全不影响原有使用） =================
 * 账号体系：同步码 HY-XXXX-XXXX 为根凭证（注册即得、可直接登录、忘记密码的找回钥匙）；
 *          账号名+密码为可选的第二种登录方式。
 * 同步策略：离线优先。本地 localStorage 永远是主副本，云端是镜像备份；
 *          同步失败静默重试，绝不打断学习。
 * 安全底线（对抗审查后加固）：
 *  - 任何"应用云端数据"前：先做结构校验，再把本地旧档存入带时间戳的备份槽（可在界面恢复）
 *  - 首次登录/换账号（本地无同步记录）且本地有进度时，一律走"进度多者胜"的冲突合并，绝不盲替换
 *  - 推送走乐观并发（base_server_at），云端被别的设备先写会返回 409，走冲突合并后重试
 *  - "疑似损坏档"（词态为空但 XP/打卡非零、或当前词书数据尚未加载）绝不推送
 *  - dirty 标记落盘，关页/杀进程后下次打开会补传
 *  - 训练中（背词/速刷/连连看或任何弹层界面）不替换当前进度
 * 注：顶层状态用 var（无 TDZ），杜绝构建拼接顺序引发的初始化崩溃。
 */

var SYNC_AUTH_KEY = 'hylite_sync_auth';
var SYNC_META_KEY = 'hylite_sync_meta';
var SYNC_BACKUP_PREFIX = 'hylite_sync_backup__';

var syncAuth = null;      // {token, user:{sync_code, username, nickname}}
var syncMeta = {};        // { bookId: {serverAt, pushedAt, dirty, seq, lastPushTs} }
var syncBusy = false;
var syncApplying = false; // 应用云端数据时不把 save() 记为脏
var syncLastOk = null, syncLastErr = null;
var syncPushT = null;
var syncUiBusy = false;   // 表单防重复提交

/* ---------------- 本地状态 ---------------- */
function syncLoadLocal(){
  try { syncAuth = JSON.parse(store() && store().getItem(SYNC_AUTH_KEY)) || null; } catch(e){ syncAuth = null; }
  try { syncMeta = JSON.parse(store() && store().getItem(SYNC_META_KEY)) || {}; } catch(e){ syncMeta = {}; }
  if (syncAuth && (!syncAuth.token || !syncAuth.user)) syncAuth = null;
}
function syncSaveLocal(){
  try { const st = store(); if (!st) return;
    if (syncAuth) st.setItem(SYNC_AUTH_KEY, JSON.stringify(syncAuth)); else st.removeItem(SYNC_AUTH_KEY);
    st.setItem(SYNC_META_KEY, JSON.stringify(syncMeta));
  } catch(e){}
}
function syncUser(){ return (syncAuth && syncAuth.user) || null; }
function syncDevice(){
  try { const ua = navigator.userAgent;
    const os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac/.test(ua) ? 'Mac' : '其他';
    return os + (/(MicroMessenger)/.test(ua) ? '·微信' : '');
  } catch(e){ return '未知'; }
}

/* ---------------- API（带 15 秒超时） ---------------- */
async function syncApi(path, opts){
  opts = opts || {};
  const headers = { 'Content-Type': 'application/json' };
  if (syncAuth && syncAuth.token) headers['Authorization'] = 'Bearer ' + syncAuth.token;
  let ctrl = null, timer = null;
  try { ctrl = new AbortController(); timer = setTimeout(()=>ctrl.abort(), 15000); } catch(e){}
  let res;
  try {
    res = await fetch('/api/' + path, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      keepalive: !!opts.keepalive,
      signal: ctrl ? ctrl.signal : undefined,
    });
  } catch(e){
    if (timer) clearTimeout(timer);
    syncLastErr = '网络连不上';
    return { ok:false, error:'网络连不上', _net:true };
  }
  if (timer) clearTimeout(timer);
  let j; try { j = await res.json(); } catch(e){ j = { ok:false, error:'服务响应异常' }; }
  j._status = res.status;
  if (res.status === 401 && syncAuth && path !== 'logout' && !path.startsWith('login')){
    // 会话失效：清除登录态但绝不动本地进度
    syncAuth = null; syncSaveLocal();
    try { toast('云同步登录已过期，请重新登录'); } catch(e){}
    if (!screen) try { render(); } catch(e){}
  }
  return j;
}

/* ---------------- 进度读取 / 档案体检 ---------------- */
function syncBookRaw(id){
  if (id === curBookId){
    // 当前词书数据未加载完成时，内存 S 可能是被 normalize 掏空的档 → 用 localStorage 里的原档
    if (typeof TOTAL !== 'undefined' && TOTAL === 0){
      try { return (store() && store().getItem(KEY_BASE + '__' + id)) || null; } catch(e){ return null; }
    }
    try { return JSON.stringify(S); } catch(e){ return null; }
  }
  try { return (store() && store().getItem(KEY_BASE + '__' + id)) || null; } catch(e){ return null; }
}
function syncParse(raw){
  if (!raw) return null;
  try { const d = JSON.parse(raw); return (d && typeof d === 'object' && !Array.isArray(d)) ? d : null; } catch(e){ return null; }
}
function syncIsEmpty(raw){
  const d = syncParse(raw);
  if (!d) return true;
  return Object.keys(d.w || {}).length === 0 && !(d.xp > 0) && Object.keys(d.ck || {}).length === 0;
}
function syncValidArchive(d){
  return !!(d && typeof d === 'object' && !Array.isArray(d) && d.w && typeof d.w === 'object' && !Array.isArray(d.w));
}
// 疑似损坏档：词态空但 XP/打卡非零（多半是词书数据没加载时被清洗过的档）→ 禁止外传
function syncLooksPoisoned(d){
  return syncValidArchive(d) && Object.keys(d.w).length === 0 && ((d.xp|0) > 0 || Object.keys(d.ck || {}).length > 0);
}
// 档案体检：{ok, raw, reason} reason: missing|invalid|poisoned|empty|oversize
function syncInspectBook(id){
  const raw = syncBookRaw(id);
  if (!raw) return { ok:false, reason:'missing' };
  const d = syncParse(raw);
  if (!syncValidArchive(d)) return { ok:false, reason:'invalid' };
  if (syncLooksPoisoned(d)) return { ok:false, reason:'poisoned' };
  if (Object.keys(d.w).length === 0 && !(d.xp > 0) && Object.keys(d.ck || {}).length === 0) return { ok:false, reason:'empty' };
  if (raw.length > 1200000) return { ok:false, raw, reason:'oversize' };
  return { ok:true, raw };
}
// 可安全推送的档；不可推送返回 null
function syncPushableRaw(id){
  const r = syncInspectBook(id);
  if (r.reason === 'oversize') syncLastErr = '进度体积超限，暂无法同步';
  return r.ok ? r.raw : null;
}
function syncScore(d){ // 冲突时比较"谁的进度多"：XP 为主，已学词数为辅
  let seen = 0; for (const k in (d.w || {})){ const st = d.w[k]; if (st && (st.s > 0 || st.z)) seen++; }
  return (d.xp|0) * 1000000 + seen;
}

/* ---------------- 备份槽（带时间戳，每本书保留最近 2 份，可在界面恢复） ---------------- */
function syncBackup(id, raw, why){
  try {
    const st = store(); if (!st) return;
    st.setItem(SYNC_BACKUP_PREFIX + id + '__' + Date.now() + '__' + why, raw);
    // 修剪：每本书最多留 2 份
    const keys = [];
    for (let i = 0; i < st.length; i++){ const k = st.key(i); if (k && k.indexOf(SYNC_BACKUP_PREFIX + id + '__') === 0) keys.push(k); }
    keys.sort();
    while (keys.length > 2) st.removeItem(keys.shift());
  } catch(e){}
}
function syncListBackups(){
  const out = [];
  try {
    const st = store(); if (!st) return out;
    for (let i = 0; i < st.length; i++){
      const k = st.key(i);
      if (!k || k.indexOf(SYNC_BACKUP_PREFIX) !== 0) continue;
      const rest = k.slice(SYNC_BACKUP_PREFIX.length).split('__');   // id, ts, why
      if (rest.length < 3) continue;
      out.push({ key: k, book: rest[0], ts: Number(rest[1]) || 0, why: rest[2] });
    }
  } catch(e){}
  out.sort((a, b) => b.ts - a.ts);
  return out;
}
function syncRestoreBackup(key){
  try {
    const st = store(); if (!st) return;
    const raw = st.getItem(key); if (!raw) { toast('备份不存在'); return; }
    const d = syncParse(raw);
    if (!syncValidArchive(d)){ toast('备份数据损坏，无法恢复'); return; }
    const book = key.slice(SYNC_BACKUP_PREFIX.length).split('__')[0];
    ask('用这份备份覆盖《' + ((BOOKS.find(b=>b.id===book)||{}).name || book) + '》当前进度吗？\n覆盖前会把当前进度存为新备份。', ()=>{
      const cur = syncBookRaw(book);
      if (cur && !syncIsEmpty(cur)) syncBackup(book, cur, 'beforerestore');
      syncApplying = true;
      try {
        st.setItem(KEY_BASE + '__' + book, raw);
        if (book === curBookId){ S = load(); todayPlan(); applyTheme(); }
      } finally { syncApplying = false; }
      const m = syncMeta[book] || (syncMeta[book] = {});
      m.dirty = true; m.seq = (m.seq||0) + 1; syncSaveLocal();
      toast('✔ 已恢复备份' + (syncAuth ? '，正在同步到云端…' : ''));
      if (syncAuth) syncPushIntent(book);
      closeModal(); if (!screen) render();
    }, '恢 复', true);
  } catch(e){ toast('恢复失败'); }
}
// 用户显式意图(恢复备份/导入文件)的推送：先对齐云端当前版本号再立即强推，
// 不参与"进度多者胜"合并——用户点了恢复，就要以用户选择为准
async function syncPushIntent(book){
  if (!syncAuth) return;
  try {
    const cur = await syncApi('sync?book=' + book);
    const m = syncMeta[book] || (syncMeta[book] = {});
    if (cur.ok) m.serverAt = cur.exists ? cur.server_at : null;
    m.dirty = true; m.seq = (m.seq||0) + 1; m.force = true;
    syncSaveLocal();
    const okPush = await syncPushBook(book);
    if (okPush) try { toast('✔ 已同步到云端'); } catch(e){}
  } catch(e){}
}

/* ---------------- 推送（乐观并发 + 409 冲突合并） ---------------- */
async function syncPushBook(id, isRetry){
  if (!syncAuth) return false;
  const m = syncMeta[id] || (syncMeta[id] = {});
  const insp = syncInspectBook(id);
  if (!insp.ok){
    // 超限是"合法数据暂时推不动"→ 保持脏标记等待(比如用户删些笔记后就能推)；其余(空/损坏/缺档)清脏防空转
    if (insp.reason === 'oversize'){ syncLastErr = '进度体积超限，暂无法同步'; }
    else { m.dirty = false; syncSaveLocal(); }
    return false;
  }
  const raw = insp.raw;
  const seq0 = m.seq || 0;
  const r = await syncApi('sync', { method:'POST', body:{
    book_id: id, data: raw,
    updated_at: new Date().toISOString(),
    base_server_at: m.serverAt || null,
    device: syncDevice(),
  }});
  if (r.ok){
    m.serverAt = r.server_at; m.pushedAt = r.updated_at; m.lastPushTs = Date.now();
    if ((m.seq || 0) === seq0) m.dirty = false;    // 请求在途期间又有新改动则保持脏
    syncLastOk = Date.now(); syncLastErr = null; syncSaveLocal();
    return true;
  }
  if (r._status === 409 && r.conflict && !isRetry){
    // 同数据快进：云端就是这份数据(典型: keepalive 推送成功但没记账) → 只对齐版本号，不备份不重推
    if (r.data === raw){
      m.serverAt = r.server_at;
      if ((m.seq || 0) === seq0) m.dirty = false;
      syncSaveLocal();
      return true;
    }
    // 云端被别的设备先写：进度多者胜
    const cloudD = syncParse(r.data), localD = syncParse(raw);
    if (cloudD && localD && syncValidArchive(cloudD)){
      if (syncScore(cloudD) > syncScore(localD)){
        if (!syncCanApply(id)) return false;       // 界面忙时跳过本轮，不写备份不空转
        syncBackup(id, raw, 'conflictlocal');
        const applied = await syncApplyCloud(id, { data: r.data, server_at: r.server_at, updated_at: r.server_at });
        if (applied) try { toast('检测到另一台设备的更新，已采用进度较多的一份'); } catch(e){}
        return applied;
      }
      syncBackup(id, r.data, 'conflictcloud');
      m.serverAt = r.server_at; syncSaveLocal();   // 接受新 base 再推一次
      return syncPushBook(id, true);
    }
  }
  if (!r._net) syncLastErr = r.error || '同步失败';
  return false;
}
async function syncPushDirty(){
  if (!syncAuth || syncBusy) return;
  syncBusy = true;
  try {
    for (const id of Object.keys(syncMeta)){
      const m = syncMeta[id];
      if (!m || !m.dirty) continue;
      if (m.lastPushTs && Date.now() - m.lastPushTs < 20000 && !m.force) continue;   // 每本书至少间隔 20 秒
      delete m.force;
      await syncPushBook(id);
    }
  } finally { syncBusy = false; }
  syncRefreshCard();
}
function syncSchedulePush(){
  clearTimeout(syncPushT);
  syncPushT = setTimeout(()=>{ syncPushDirty(); }, 10000);
}

/* ---------------- 应用云端数据（结构校验 + 备份 + 经 normalize 落地） ---------------- */
// 当前书能否安全替换：训练/速刷/连连看/子页面/弹窗打开时都不行；词书数据没加载好也不行
function syncCanApply(id){
  if (id !== curBookId) return true;
  if ((typeof SES !== 'undefined' && SES) || (typeof FL !== 'undefined' && FL) ||
      (typeof ML !== 'undefined' && ML) || screen) return false;
  try { const md = document.getElementById('modal'); if (md && md.classList.contains('show')) return false; } catch(e){}
  if (typeof TOTAL !== 'undefined' && TOTAL === 0) return false;
  return true;
}
async function syncApplyCloud(id, r){
  const cloud = syncParse(r.data);
  if (!syncValidArchive(cloud)) return false;
  if (!syncCanApply(id)) return false;
  const oldRaw = syncBookRaw(id);
  if (oldRaw && !syncIsEmpty(oldRaw)) syncBackup(id, oldRaw, 'replaced');
  syncApplying = true;
  try {
    const st = store(); if (!st) return false;
    st.setItem(KEY_BASE + '__' + id, r.data);
    if (id === curBookId){
      S = load();          // 经 load()→normalize() 清洗落地，畸形字段在这里被修正
      todayPlan(); applyTheme();
      try { updateChrome(); } catch(e){}
    }
  } catch(e){ return false; }
  finally { syncApplying = false; }
  syncMeta[id] = { serverAt: r.server_at, pushedAt: r.updated_at, dirty: false, seq: (syncMeta[id]||{}).seq || 0 };
  syncSaveLocal();
  if (id === curBookId){
    if (!screen) try { render(); } catch(e){}
    // render()→tryCheckin() 可能刚在应用后的新档上打了卡(改动 S) → 正常标脏走同步，防本地静默领先
    try { if (JSON.stringify(S) !== r.data) syncOnSave(); } catch(e){}
  }
  return true;
}

/* ---------------- 全量核对（拉取 + 冲突合并 + 云端缺的书补传） ---------------- */
async function syncPullCheck(){
  if (!syncAuth || syncBusy) return;
  syncBusy = true;
  let metaOk = false;
  try {
    const meta = await syncApi('sync-meta');
    if (!meta.ok){ if (!meta._net) syncLastErr = meta.error; return; }
    metaOk = true;
    const cloudBooks = {};
    for (const b of (meta.books || [])) cloudBooks[b.book_id] = b;

    for (const bid of Object.keys(cloudBooks)){
      const cb = cloudBooks[bid];
      const m = syncMeta[bid];
      const known = (m || {}).serverAt;
      const dirty = !!(m || {}).dirty;
      const raw = syncBookRaw(bid);
      const localHasData = !syncIsEmpty(raw);
      const cloudNew = cb.server_at !== known;
      const firstContact = !m || !m.serverAt;    // 本机对这本书没有任何同步记录（首次登录/换账号/清过缓存）

      if (!cloudNew && !dirty) continue;
      if (!cloudNew && dirty){ await syncPushBook(bid); continue; }

      // 云端有本机未见过的版本
      const r = await syncApi('sync?book=' + bid);
      if (!r.ok || !r.exists) continue;

      // 同数据快进：云端与本机内容一致(典型: keepalive 推送成功但没记账) → 只对齐版本号
      if (r.data === raw){
        const mm = syncMeta[bid] || (syncMeta[bid] = {});
        mm.serverAt = r.server_at; mm.pushedAt = r.updated_at; mm.dirty = false;
        syncSaveLocal();
        continue;
      }

      if (!localHasData){ await syncApplyCloud(bid, r); continue; }

      if (firstContact || dirty){
        // 首次接触 或 双边都有改动 → 进度多者胜，落败方备份
        const cloudD = syncParse(r.data), localD = syncParse(raw);
        if (!cloudD || !localD || !syncValidArchive(cloudD)){ if (dirty) await syncPushBook(bid); continue; }
        const localInsp = syncInspectBook(bid);
        // 本地档不可推送时不能"胜出"：损坏档 → 采用云端修复；超限档 → 保持现状等待，不动版本号
        const localWins = syncScore(localD) >= syncScore(cloudD) && localInsp.ok;
        if (!localInsp.ok && localInsp.reason !== 'oversize'){
          if (syncCanApply(bid)){ syncBackup(bid, raw, 'loginlocal'); await syncApplyCloud(bid, r); }
          continue;
        }
        if (!localInsp.ok && localInsp.reason === 'oversize'){ syncLastErr = '进度体积超限，暂无法同步'; continue; }
        if (!localWins){
          if (!syncCanApply(bid)) continue;        // 界面忙 → 本轮跳过，不写备份
          syncBackup(bid, raw, firstContact ? 'loginlocal' : 'conflictlocal');
          const applied = await syncApplyCloud(bid, r);
          if (applied) try { toast('《' + ((BOOKS.find(b=>b.id===bid)||{}).name||bid) + '》已采用云端较多的进度，本机原进度已备份'); } catch(e){}
        } else {
          syncBackup(bid, r.data, firstContact ? 'logincloud' : 'conflictcloud');
          const mm = syncMeta[bid] || (syncMeta[bid] = {});
          mm.serverAt = r.server_at;             // 以云端当前版本为 base 覆盖推送
          mm.dirty = true; mm.seq = (mm.seq||0) + 1;
          await syncPushBook(bid);
        }
        continue;
      }

      // 本机干净、云端更新（典型：另一台设备学习了）→ 采用云端
      await syncApplyCloud(bid, r);
    }

    // 云端没有、本机有实际进度的书 → 补传（仅在 meta 拉取成功后才做，防止盲推覆盖）
    for (const b of BOOKS){
      if (cloudBooks[b.id]) continue;
      const raw = syncPushableRaw(b.id);
      if (raw){
        const mm = syncMeta[b.id] || (syncMeta[b.id] = {});
        mm.serverAt = null; mm.dirty = true; mm.seq = (mm.seq||0) + 1;
        await syncPushBook(b.id);
      }
    }
    syncLastOk = Date.now(); syncLastErr = null; syncSaveLocal();
  } finally {
    syncBusy = false;
    syncRefreshCard();
  }
  return metaOk;
}

/* ---------------- 存档/切书钩子（bc-core 调用） ---------------- */
function syncOnSave(){
  if (!syncAuth || syncApplying) return;
  const m = syncMeta[curBookId] || (syncMeta[curBookId] = {});
  m.dirty = true; m.seq = (m.seq || 0) + 1;
  syncSaveLocal();                                   // 脏标记落盘：关页/杀进程后下次打开补传
  syncSchedulePush();
}
function syncOnBookSwitch(){
  if (!syncAuth) return;
  setTimeout(()=>{ syncPullCheck(); }, 400);
}

async function syncNow(){
  if (!syncAuth){ try { toast('请先登录云同步'); } catch(e){} return; }
  if (syncBusy){ try { toast('正在同步中…'); } catch(e){} return; }

  ask('退出云同步登录？\n本机进度不受影响，只是不再自动同步。', async ()=>{
    // 退出前把最后的改动传完，否则最近几十秒的学习就永远留在本机了
    try { if (typeof petPushT!=='undefined') clearTimeout(petPushT); if (typeof petCloudPush==='function') await petCloudPush(); } catch(e){}   // 宠物最后一次改动也趁还登录着刷上云
    const hasDirty = Object.keys(syncMeta).some(id => syncMeta[id] && syncMeta[id].dirty);

/* ---------------- 启动与周期任务 ---------------- */
function syncBoot(){
  syncLoadLocal();
  if (syncAuth){
    try { if (typeof petCloudPull==='function') setTimeout(()=>petCloudPull(), 1200); } catch(e){}   // 启动拉宠物
    // 等词书数据就绪后做一次全量核对（含上次没传完的脏数据补传）
    const tryStart = (n)=>{
      if (typeof TOTAL !== 'undefined' && TOTAL > 0){ syncPullCheck(); return; }
      if (n < 30) setTimeout(()=>tryStart(n+1), 500);
    };
    tryStart(0);
  }
  setInterval(()=>{ syncPushDirty(); }, 60 * 1000);
  setInterval(()=>{ if (typeof SES === 'undefined' || !SES) syncPullCheck(); }, 8 * 60 * 1000);
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState === 'hidden'){
      // 离开页面前尽力推送当前词书。keepalive 有 64KB 字节上限(中文按 3 字节估算)，
      // 大档跳过——脏标记已落盘，下次打开会自动补传，不会丢。
      if (!syncAuth) return;
      const id = curBookId;
      const m = syncMeta[id];
      if (!m || !m.dirty) return;
      const raw = syncPushableRaw(id);
      if (raw && raw.length * 3 < 60000){
        const seq0 = m.seq || 0;
        syncApi('sync', { method:'POST', keepalive:true, body:{
          book_id:id, data:raw, updated_at:new Date().toISOString(),
          base_server_at:m.serverAt || null, device:syncDevice() } })
        .then(r => {
          // 页面若还活着(切后台没被杀)，把推送结果记账，避免切回时误判冲突
          if (r && r.ok){
            m.serverAt = r.server_at; m.pushedAt = r.updated_at; m.lastPushTs = Date.now();
            if ((m.seq || 0) === seq0) m.dirty = false;
            syncSaveLocal();
          }
        }).catch(()=>{});
      }
    } else if (document.visibilityState === 'visible'){
      if (syncAuth && (typeof SES === 'undefined' || !SES)) setTimeout(()=>syncPullCheck(), 800);
    }
  });
}
setTimeout(syncBoot, 600);

'use strict';
/* ================= 学习伙伴 · 表情图鉴 =================
 * 登录后才有。养一只小动物（狗/猫/鼠…可选），每背满 50 个词点亮一个新表情，一套集齐 6 个。
 * 学生可自选展示哪个已解锁表情：主页大图 + 答题右下角小挂件都用它。
 * 台词本地文案库（预留 petLineLLM() 以后可接 AI）。进度存本地(登录可见)。
 * —— 加新物种：deploy/vocabulary/pet/<id>/p1..p6.gif 放好，PET_SPECIES 加一行即可。
 */

var PET_KEY = 'hylite_petdex_v1';
var petState = null;
var petPending = null;

// 每个表情槽的默认属性（解锁门槛 / 情绪 / 名字）。各物种默认复用这套映射，特殊的可在物种里覆盖。
// 功能总开关：false = 只有预览(?pet=1/?petall=1)能看到，普通学生看不到；确认上线后改 true 对所有登录用户开放
// 2026-07-19 用户确认正式开放：所有登录学生可见表情图鉴/答题挂件/收集解锁
var PET_LIVE = true;
var PET_STEP = 20;   // 每背 20 词解锁一个
// 用 [情绪, 名字] 列表定义每套表情（顺序 = p1,p2,...）。情绪决定什么场景自动露脸：
//   idle待机 / start开学 / happy高兴 / angry催学 / cry委屈 / tired摸鱼 / play互动 / confused懵 / neutral日常
function petMk(list, i){ return { id:i+1, file:'p'+(i+1)+'.gif', mood:list[0], name:list[1] }; }
var PET_SPECIES = [
  { id:'cat', name:'月薪喵', folder:'cat', emotes:[
    ['idle','呆萌'],['start','上号'],['happy','开心'],['angry','生气'],['cry','委屈'],['tired','摸鱼'],['cry','大哭'],['confused','懵圈'],['play','贴贴'] ].map(petMk) },
  { id:'rat', name:'抑郁大鼠', folder:'rat', emotes:[
    ['idle','呆萌'],['happy','开心'],['tired','躺平'],['angry','黑脸'],['cry','捂嘴'] ].map(petMk) },
  { id:'linedog', name:'线条小狗', folder:'linedog', emotes:[
    ['idle','呆坐'],['happy','蹦跶'],['start','摇摆'],['neutral','呆站'],['idle','毛球'],['tired','躺平'],['confused','趴着'],['play','贴贴'] ].map(petMk) },
];
function petSpecies(){ return PET_SPECIES.find(s=>s.id===petState.species) || PET_SPECIES[0]; }
function petSlots(){ return petSpecies().emotes.length; }   // 当前物种表情总数(不再固定 6)
// 预览：url 带 ?petall=1 全部解锁+免登录看；?pet=1 只是提前开启功能(仍需登录)
function petPreviewAll(){ try { return /[?&]petall=1/.test(location.search); } catch(e){ return false; } }
function petPreviewOn(){ try { return PET_LIVE || /[?&]pet(all)?=1/.test(location.search); } catch(e){ return PET_LIVE; } }
// 是否显示宠物卡片：预览全解锁模式(免登录) 或 (功能已开 且 已登录)
function petVisible(){ if (petPreviewAll()) return true; if (!petPreviewOn()) return false; try { return typeof syncUser==='function' && !!syncUser(); } catch(e){ return false; } }

function petLoad(){
  try { petState = JSON.parse(store() && store().getItem(PET_KEY)); } catch(e){ petState = null; }
  if (!petState || typeof petState !== 'object'){
    // 首次：用已学词数折算已解锁数(每20词1个)，老用户不空手
    let seed = 0;
    try { if (typeof counts==='function'){ const c=counts(); seed = c.seen||0; } } catch(e){}
    petState = { name:'旺仔', learned:seed, wordGranted:Math.floor(seed/PET_STEP), dex:{}, lastClaim:'', lastSeen: today(), species:'cat', pick:0 };
    petState.dex.cat = petState.wordGranted;
    petSave();
  }
  if (typeof petState.learned !== 'number') petState.learned = 0;
  if (typeof petState.wordGranted !== 'number') petState.wordGranted = Math.floor(petState.learned/PET_STEP);
  if (!petState.dex || typeof petState.dex !== 'object') petState.dex = {};
  if (!petState.name) petState.name = '旺仔';
  if (!petState.species || !PET_SPECIES.some(s=>s.id===petState.species)) petState.species = PET_SPECIES[0].id;
  if (typeof petState.pick !== 'number') petState.pick = 0;
  if (typeof petState.still !== 'boolean') petState.still = false;   // 静止/动图偏好
  return petState;
}
var petPushT = null, petPulled = false;
function petSave(){
  try { store() && store().setItem(PET_KEY, JSON.stringify(petState)); } catch(e){}
  petSchedulePush();
}

/* ---------- 云同步（跟随账号；宠物全局一份，冲突取收集更多的一方） ---------- */
function petCloudOn(){ try { return typeof syncUser==='function' && !!syncUser() && typeof syncApi==='function'; } catch(e){ return false; } }
function petScore(p){ let s=Math.max(0,Number(p&&p.learned)||0); if(p&&p.dex) for(const k in p.dex) s+=Math.max(0,Number(p.dex[k])||0)*5; return s; }
function petMergeInto(cloud){
  // 把云端合进本地：learned 取大、每套 dex 取大、签到日期取晚、名字/当前物种/展示以"分高的一方"为准
  if (!cloud || typeof cloud!=='object') return;
  const localScore = petScore(petState), cloudScore = petScore(cloud);
  petState.learned = Math.max(petState.learned||0, cloud.learned||0);
  petState.wordGranted = Math.max(petState.wordGranted||0, cloud.wordGranted||0);
  const dex = petState.dex||{}; const cd = cloud.dex||{};
  for (const k in cd) dex[k] = Math.max(dex[k]||0, cd[k]||0);
  petState.dex = dex;
  if ((cloud.lastClaim||'') > (petState.lastClaim||'')) petState.lastClaim = cloud.lastClaim;
  if (cloudScore > localScore){   // 云端更"资深"，沿用它的身份/展示设置
    if (cloud.name) petState.name = cloud.name;
    if (cloud.species) petState.species = cloud.species;
    if (typeof cloud.pick==='number') petState.pick = cloud.pick;
    if (typeof cloud.still==='boolean') petState.still = cloud.still;
  }
}
async function petCloudPull(){
  if (!petCloudOn()) return;
  if (!petState) petLoad();
  try {
    const r = await syncApi('pet');
    if (r && r.ok && r.exists && r.data){
      let cloud; try { cloud = JSON.parse(r.data); } catch(e){ cloud=null; }
      if (cloud){ petMergeInto(cloud); try{ store()&&store().setItem(PET_KEY, JSON.stringify(petState)); }catch(e){}
        if (typeof render==='function' && !screen && petVisible()) render(); }
    }
    petPulled = true;
    petCloudPush();   // 合并后把结果推回，保证云端也是合并态
  } catch(e){}
}
async function petCloudPush(){
  if (!petCloudOn() || !petState) return;
  try {
    const r = await syncApi('pet', { method:'POST', body:{ data: JSON.stringify(petState) } });
    // 服务端可能返回"分更高的云端版本"，据此对齐本地，避免来回覆盖
    if (r && r.ok && r.data){ try { const back=JSON.parse(r.data); if (petScore(back)>petScore(petState)){ petMergeInto(back); store()&&store().setItem(PET_KEY, JSON.stringify(petState)); if(typeof render==='function'&&!screen&&petVisible()) render(); } } catch(e){} }
  } catch(e){}
}
function petSchedulePush(){
  if (!petCloudOn()) return;
  clearTimeout(petPushT);
  // 8s 防抖：连续背词时定时器不断重置，只在停顿后推一次，既省请求又避开 60/600s 限流
  petPushT = setTimeout(()=>{ petCloudPush(); }, 8000);
}

/* ---------- 解锁进度（按已解锁"数量"推进：背词 + 每日领取都 +1；每套独立） ---------- */
function petUnlockedCount(){ if (petPreviewAll()) return petSlots(); return Math.min(petSlots(), petState.dex[petState.species] || 0); }
function petIsUnlocked(e){ return e.id <= petUnlockedCount(); }
function petEmoteSrc(e){ return 'pet/' + petSpecies().folder + '/' + e.file; }        // 动图（图鉴/预览恒用）
function petStillSrc(e){ return 'pet/' + petSpecies().folder + '/' + e.file.replace(/\.gif$/, '-s.gif'); }  // 静止首帧
// 主图/答题挂件按学生偏好：静止模式给首帧，否则给动图
function petShowSrc(e){ return (petState && petState.still) ? petStillSrc(e) : petEmoteSrc(e); }
// 给当前物种解锁下一个表情；reason 用于台词/提示
function petGrantOne(reason){
  const sp = petState.species, cur = petState.dex[sp] || 0;
  if (cur >= petSlots()) return false;
  petState.dex[sp] = cur + 1;
  petState._justUnlocked = cur + 1;
  petPending = 'unlock';
  try { toast('🎁 ' + (reason==='daily'?'今日签到，':'') + '解锁新表情：' + petSpecies().emotes[cur].name + '！'); sfx('ck'); confetti(); } catch(e){}
  return true;
}
// 今日能否领取（登录且当前物种没集满且今天没领过）
function petCanClaim(){ return petState && petState.lastClaim !== today() && (petState.dex[petState.species]||0) < petSlots(); }
function petClaim(){
  if (!petState) petLoad();
  if (petState.lastClaim === today()){ try{ toast('今天已经领过啦，明天再来～'); }catch(e){} return; }
  if ((petState.dex[petState.species]||0) >= petSlots()){ try{ toast('这只已经集齐啦，换个伙伴继续收集吧！'); }catch(e){} return; }
  petState.lastClaim = today();
  petGrantOne('daily');
  petSave();
  if (typeof render==='function' && !screen) render();
}

/* ---------- 心情 + 当前该露脸的表情 ---------- */
function petMoodNow(){
  const t = today();
  const studiedToday = (S && S.log && S.log[t] && ((S.log[t].n||0)>0 || (S.log[t].q||0)>0));
  const checkedIn = (S && S.ck && S.ck[t]);
  let hr = 12; try { hr = new Date().getHours(); } catch(e){}
  if (checkedIn) return 'happy';
  if (hr>=23 || hr<6) return 'tired';
  if (!studiedToday) return 'angry';
  return 'idle';
}
// 学生选中的展示表情（若已选且已解锁）优先；否则按心情/事件挑一个已解锁的
function petCurrentEmote(){
  const em = petSpecies().emotes;
  const unlocked = em.filter(petIsUnlocked);
  if (!unlocked.length) return null;
  if (petState.pick){ const p = em.find(e=>e.id===petState.pick); if (p && petIsUnlocked(p)) return p; }
  let want = petMoodNow();
  if (petPending==='unlock' && petState._justUnlocked){ const j=em.find(e=>e.id===petState._justUnlocked); if (j) return j; }
  else if (petPending==='cry' || petPending==='praise_low') want='cry';
  else if (petPending==='praise_hi' || petPending==='checkin') want='happy';
  return unlocked.find(e=>e.mood===want) || unlocked[unlocked.length-1] || unlocked[0];
}

/* ---------- 喂养（只有"学新词"计入解锁） ---------- */
function petFeed(kind){
  if (!petState) petLoad();
  if (kind==='learn'){
    petState.learned += 1; petState.lastSeen = today();
    // 每满 PET_STEP 个词发一个解锁额度（用 wordGranted 记账，避免撤销后重复发）
    const due = Math.floor(petState.learned / PET_STEP);
    if (due > petState.wordGranted){ petState.wordGranted = due; petGrantOne('word'); }
    petSave(); return 1;
  }
  if (kind==='checkin'){ petState.lastSeen=today(); if(!petPending) petPending='checkin'; petSave(); }
  return 0;
}
function petUnfeed(amount){
  if (!petState || !amount) return;
  petState.learned = Math.max(0, petState.learned - amount);
  petState.wordGranted = Math.min(petState.wordGranted, Math.floor(petState.learned/PET_STEP));
  petSave();
}
function petAfterSession(acc, n){
  if (petPending==='unlock') return;
  if (acc>=95) petPending='praise_hi'; else if (acc<60) petPending='cry'; else petPending='praise_mid';
}

const LIB_FS=[['all','全部'],['new','未学'],['learn','学习中'],['master','已掌握'],['zhan','已斩'],['star','星标'],['note','有笔记']];
function setLibF(f){ libF=f; renderLibBody(); }
function renderLibBody(){
  const fs=$('#libFs');
  if (fs) fs.innerHTML=LIB_FS.map(([f,n])=>`<button class="${libF===f?'on':''}" onclick="setLibF('${f}')">${n}</button>`).join('');
  const body=$('#libBody'); if (!body) return;
  const q=libQ.trim().toLowerCase();
  const fOk=W=>{
    if (libF==='all') return true;
    if (libF==='star'){ const st=wsPeek(W.k); return st&&st.st; }
    if (libF==='note'){ const st=wsPeek(W.k); return st&&st.note; }
    return statusOf(W.k)===libF;
  };
  let h='';
  if (q || libF!=='all'){
    const hits=[];
    for (const W of WORDS){
      if (!fOk(W)) continue;
      if (q){
        const a=W.w.toLowerCase(); let sc=-1;
        if (a===q) sc=0; else if (a.startsWith(q)) sc=1; else if (a.includes(q)) sc=2;
        else if (W.g.toLowerCase().includes(q)) sc=3;
        if (sc<0) continue; hits.push({sc,W});
      } else hits.push({sc:0,W});
    }
    hits.sort((x,y)=>x.sc-y.sc);
    const top=hits.slice(0,60);
    h+=`<div class="muted" style="margin:4px 4px 8px">${hits.length} 个词${hits.length>60?' · 显示前 60':''}</div>`;
    if (top.length){ h+=`<div class="card">`; top.forEach(x=>h+=wRow(x.W)); h+=`</div>`; }
    else h+=`<div class="card empty">没有匹配的词</div>`;
  } else {
    const block=(title,list)=>{
      h+=`<div class="sec">${title}</div>`;
      list.forEach(u=>{
        let m=0,l=0,z=0;
        u.words.forEach((w,i)=>{ const s=statusOf(u.id+':'+i); if(s==='master')m++; else if(s==='learn')l++; else if(s==='zhan')z++; });
        h+=`<button class="urow" onclick="openScreen({type:'unit',id:'${u.id}'})">
          <span class="tt"><b>${esc(u.name)}</b>
          <span class="gbar"><i class="g1" style="width:${(m+z)/u.words.length*100}%"></i><i class="g2" style="width:${l/u.words.length*100}%"></i></span></span>
          <span class="ct num">${m+z}/${u.words.length}<br>掌握</span></button>`;
      });
    };
    if (curBook().grouped){
      const bs=UNITS.filter(u=>u.id[0]==='B'), as=UNITS.filter(u=>u.id[0]==='A');
      block(`频段词表 ${bs[0].id}–${bs[bs.length-1].id}`, bs);
      block(`AWL 学术词表 ${as[0].id}–${as[as.length-1].id}`, as);
    } else {
      block(`${esc(curBook().name)} · 全部单元`, UNITS);
    }
  }
  body.innerHTML=h+footer();
}

function heatHtml(){
  const DAYS=139;                                 // 20 周
  const start=new Date(); start.setDate(start.getDate()-DAYS);
  const pad=(start.getDay()+6)%7;                 // 周一对齐
  let h='<div class="hm-wrap"><div class="hm">';
  for (let p=0;p<pad;p++) h+='<i style="visibility:hidden"></i>';
  for (let d=DAYS; d>=0; d--){
    const dt=new Date(); dt.setDate(dt.getDate()-d);
    const ds=iso(dt), L=S.log[ds];
    const q=L?(L.q||0):0;
    const lv=q<=0?0 : q<15?1 : q<40?2 : q<90?3 : 4;
    h+=`<i class="${lv?'l'+lv:''}${ds===today()?' hmtd':''}" title="${ds} · 提取 ${q} 次 · 新学 ${L?(L.n||0):0} 词 · 熟练 ${L&&(L.m||0)>0?'+':''}${L?(L.m||0):0}"></i>`;
  }
  return h+'</div></div>';
}
function calHtml(){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()-calOff);
  const y=base.getFullYear(), m=base.getMonth();
  const dim=new Date(y,m+1,0).getDate();
  const off=(new Date(y,m,1).getDay()+6)%7;
  const t=today();
  let h=`<div class="calhead"><button onclick="calOff++;render()" aria-label="上个月">‹</button>
    <span class="num">${y} 年 ${m+1} 月</span>
    <button onclick="if(calOff>0){calOff--;render()}" aria-label="下个月">›</button></div>
    <div class="calgrid">${['一','二','三','四','五','六','日'].map(d=>`<span class="wd">${d}</span>`).join('')}`;
  for (let i=0;i<off;i++) h+=`<span></span>`;
  for (let d=1;d<=dim;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const L=S.log[ds]; const q=L?(L.q||0):0;
    const lv=q<=0?0:q<20?1:q<60?2:3;
    const cls='cday'+(S.ck[ds]?' ck':(lv?' q'+lv:''))+(ds===t?' td':'')+(ds>t?' off':'');
    h+=`<span class="${cls} num" title="${ds} · 提取 ${q} 次${S.ck[ds]?' · 已打卡':''}">${d}</span>`;
  }
  return h+'</div>';
}
function barsHtml(){
  const days=[]; let mx=1;
  for (let d=13;d>=0;d--){ const ds=addDays(today(),-d); const q=(S.log[ds]||{}).q||0; mx=Math.max(mx,q); days.push({ds,q}); }
  let h='<div class="bars">';
  days.forEach((x,i)=>{ h+=`<div><b class="num">${x.q||''}</b><i style="height:${x.q?Math.max(4,Math.round(x.q/mx*62)):2}px"></i><s>${i===13?'今':x.ds.slice(8)}</s></div>`; });
  return h+'</div>';
}
function histHtml(c){
  const b=[0,0,0,0]; // 薄弱0-1 成长2-3 巩固4 掌握5+
  for (const k in S.w){ const st=S.w[k]; if (!st || st.s===0 || st.z) continue;
    const x=st.b<=1?0:st.b<=3?1:st.b===4?2:3; b[x]++; }
  const rows=[['未学',c.fresh],['薄弱',b[0]],['成长',b[1]],['巩固',b[2]],['掌握',b[3]],['已斩',c.zhan]];
  const mx=Math.max(1,...rows.map(r=>r[1]));
  return rows.map(([n,v])=>`<div class="hrow"><span class="hl">${n}</span><span class="ht"><i style="width:${v/mx*100}%${n==='已斩'?';background:var(--red)':''}${n==='未学'?';background:var(--line)':''}"></i></span><b class="hn num">${v}</b></div>`).join('');
}
function loadHtml(){
  const t=today(); const days=[];
  for (let d=0;d<7;d++) days.push({ds:addDays(t,d),n:0});
  for (const k in S.w){ const st=S.w[k];
    if (!st||st.s===0||st.z||!st.due) continue;
    const idx = st.due<=t?0:days.findIndex(x=>x.ds===st.due);
    if (idx>=0) days[idx].n++;
  }
  const mx=Math.max(1,...days.map(x=>x.n));
  const wd=['日','一','二','三','四','五','六'];
  let h='<div class="bars load">';
  days.forEach((x,i)=>{ const d=new Date(x.ds+'T00:00:00');
    h+=`<div><b class="num">${x.n||''}</b><i style="height:${x.n?Math.max(4,Math.round(x.n/mx*62)):2}px"></i><s>${i===0?'今':wd[d.getDay()]}</s></div>`; });
  return h+'</div>';
}

function exportData(){
  const out=Object.assign({}, S, {book:curBookId, bookName:curBook().name});  // 标记所属词书
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hylite-'+curBookId+'-'+today()+'.json';
  a.click();
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  inp.value='';
  if (f.size > 8*1024*1024){ toast('文件过大，不像是本应用的备份'); return; }
  const r=new FileReader();
  r.onload=()=>{
    try {
      const d=JSON.parse(r.result);
      // 备份属于别的词书时，先提示切过去再导入，避免词条被按当前书过滤丢弃
      if (d && d.book && d.book!==curBookId && BOOKS.some(b=>b.id===d.book)){
        const tb=BOOKS.find(b=>b.id===d.book);
        ask(`这份备份属于《${tb.name}》，当前在《${curBook().name}》。\n要切换到《${tb.name}》再导入吗？`,
          ()=>{ useBook(d.book, false, ()=>setTimeout(()=>{ doImport(d); }, 60)); }, '切换并导入');
        return;
      }
      doImport(d);
    } catch(e){ toast('文件格式不对，导入失败'); }
  };
  r.readAsText(f);
}
function doImport(d){
  try {
    let next=null;
    if (d && d.v===3 && d.w){ next=normalize(d); }
    else if (d && d.u){ const s=fresh(); if (!migrateOld(s,d)) throw 0; s.mig=true; next=normalize(s); }
    else throw 0;
    const cNow=counts();
    const cNew=(()=>{ let seen=0; for(const k in next.w){ if(next.w[k].s>0&&!next.w[k].z) seen++; } return seen; })();
    const cloudNote2 = (typeof syncUser==='function' && syncUser()) ? '\n⚠ 云同步已开启：导入的进度也会同步到云端和其他设备。' : '';
    ask(`导入将覆盖《${curBook().name}》当前进度：\n当前：已学 ${cNow.seen} 词 · 打卡 ${Object.keys(S.ck).length} 天\n文件：已学 ${cNew} 词 · 打卡 ${Object.keys(next.ck).length} 天\n\n确定用文件覆盖吗？`+cloudNote2,
      ()=>{ S=next; save(); applyTheme(); toast('导入成功');
        try { if (typeof syncPushIntent==='function' && typeof syncUser==='function' && syncUser()) syncPushIntent(curBookId); } catch(e){}  // 导入是显式意图，直推云端不参与分数合并
        go(0); }, '覆 盖', true);
  } catch(e){ toast('文件格式不对，导入失败'); }
}
function resetAll(){
  const cloudNote = (typeof syncUser==='function' && syncUser()) ? '\n⚠ 云同步已开启：继续学习后，云端备份和其他设备也会被新进度覆盖。' : '';
  ask('清空全部进度？\n词态、错词本、打卡、经验、成就都会删除，此操作不可撤销。'+cloudNote,
    ()=>{ S=fresh(S.cfg); save(); toast('已全部重置'); go(0); }, '清 空', true);
}

/* ================= 词书选择器 ================= */
function bookProgress(b){
  // 轻量读取某本书的独立存档，统计 掌握/已学，不切书、不 normalize
  const total=bookStat(b).words;
  let seen=0, master=0;
  if (b.id===curBookId){
    for (const k in S.w){ const st=S.w[k]; if (st.z){seen++;master++;continue;} if (st.s>0){seen++; if(st.b>=MASTER)master++;} }
  } else {
    try {
      const raw=store()&&store().getItem(KEY_BASE+'__'+b.id);
      if (raw){ const w=(JSON.parse(raw)||{}).w||{};
        for (const k in w){ const st=w[k]; if(!st||typeof st!=='object')continue;
          if (st.z){seen++;master++;continue;} if ((Number(st.s)||0)>0){seen++; if((Number(st.b)||0)>=MASTER)master++;} } }
    } catch(e){}
  }
  return {total, seen, master};
}
function openBookPicker(){
  modalK=null;
  let h=`<div class="grab"></div><div class="dw" style="font-size:22px;margin-bottom:4px">选择词书</div>
    <div class="muted" style="margin-bottom:6px">不同班用不同词书，各自的进度、打卡、错词本完全独立，随时切回不丢。</div>`;
  loadVariantPref();
  if (String(curBookId).endsWith('_r')) variantPref[curBookId.slice(0,-2)]=true;   // 勾选状态与实际一致
  let lastCat=null;
  BOOKS.forEach(b=>{
    if (b.variantOf) return;                              // 乱序变体不单列，挂在本体行内
    if (b.cat!==lastCat){ h+=`<div class="sec" style="margin-top:14px">${esc(b.cat||'词书')}</div>`; lastCat=b.cat; }
    const useR=!!variantPref[b.id];
    const target=useR ? BOOKS.find(x=>x.id===b.id+'_r') : b;    // 行的进度/单元数按将要打开的版本显示
    const p=bookProgress(target), cur=b.id===curBookId, curR=curBookId===b.id+'_r';
    const pct=p.total?Math.round(p.master/p.total*100):0;
    h+=`<button class="bookopt ${(cur||curR)?'on':''}" onclick="pickBook('${useR?b.id+'_r':b.id}')">
      <div class="spread"><b>${esc(b.name)}${b.listen?' <span class="pill">🎧 听力</span>':''}${cur?' <span class="pill">当前</span>':''}${curR?' <span class="pill">当前 · 乱序</span>':''}</b><span class="muted num">${p.master}/${p.total} 掌握</span></div>
      <div class="muted" style="font-size:12px;margin:2px 0 8px">${esc(b.sub)} · ${bookStat(target).units} 单元 · ${p.total} 词${useR?' · <b style="color:var(--mint)">将以乱序打开</b>':''}</div>
      <div class="gbar"><i class="g1" style="width:${pct}%"></i><i class="g2" style="width:${p.total?Math.round((p.seen-p.master)/p.total*100):0}%"></i></div>
      <div style="margin-top:10px;display:flex;justify-content:flex-end">
        <span onclick="event.stopPropagation();toggleVariant('${b.id}')"
          style="cursor:pointer;padding:7px 16px;border-radius:20px;font-size:13.5px;font-weight:800;letter-spacing:1px;${useR?'background:var(--mint);color:var(--onbtn);border:1.5px solid var(--mint);':'background:none;color:var(--sub);border:1.5px solid var(--line);'}">🔀 乱序版${useR?' ✓':''}</span>
      </div>
    </button>`;
  });
  h+=`<button class="b3d ghost" style="margin-top:14px" onclick="closeModal()">关 闭</button>`;
  $('#sheet').innerHTML=h;
  $('#modal').classList.add('show');
}
/* 乱序偏好：记住每本书勾没勾"乱序版"（点勾只切换偏好并留在选书页，点书才真正切换） */
let variantPref={};
function loadVariantPref(){ try{ variantPref=JSON.parse(store()&&store().getItem('hylite_bcz_variant_pref'))||{}; }catch(e){ variantPref={}; } return variantPref; }
function saveVariantPref(){ try{ store()&&store().setItem('hylite_bcz_variant_pref', JSON.stringify(variantPref||{})); }catch(e){} }
function toggleVariant(baseId){
  loadVariantPref();
  variantPref[baseId]=!variantPref[baseId];
  saveVariantPref();
  openBookPicker();          // 原地刷新选书器，不切换、不关弹层
}
function pickBook(id){
  loadVariantPref();
  const baseId=String(id).endsWith('_r')?id.slice(0,-2):id;
  variantPref[baseId]=String(id).endsWith('_r'); saveVariantPref();
  $('#modal').classList.remove('show');
  if (id===curBookId){ return; }
  useBook(id);
}

/* ================= 词卡弹层 ================= */
let modalK=null;
function openWord(k){
  clearTimeout(advT);      // 词卡弹层打开时暂停自动跳转倒计时（关闭后重渲染会重新计时）
  modalK=k;
  const W=WORDS[WIDX[k]]; const st=wsPeek(k)||{b:0,s:0,ng:0};
  const stName=st.z?'已斩':st.s===0?'未学':st.b>=MASTER?'已掌握':'学习中';
  $('#sheet').innerHTML=`<div class="grab"></div>
    <div class="spread"><div><span class="dw">${esc(W.w)}</span> <span class="dp">${W.p?'/'+esc(W.p)+'/':''}</span></div>
    <span class="pill ${st.z?'rd':st.b>=MASTER?'':'am'}">${stName}</span></div>
    <div class="saybtns">
      <button data-say="${A(W.w)}">${SPK} 英音</button>
      <button data-say2="${A(W.w)}">${SPK} 美音</button>
    </div>
    <div class="dg">${esc(W.g)}</div>
    <div class="kv"><span>记忆强度</span><b>${strength(st)} <span class="num">${Math.min(MAXB,st.b||0)}/7</span></b></div>
    <div class="kv"><span>下次复习</span><b class="num">${st.z?'—':st.b>=MAXB?'已烂熟':st.due||'学完新词后排期'}</b></div>
    <div class="kv"><span>提取 / 答错</span><b class="num">${st.s||0} / ${st.ng||0} 次</b></div>
    <div class="kv"><span>所属单元</span><b>${esc((UNITS.find(u=>u.id===W.u)||{}).name||W.u)}</b></div>
    <textarea class="notein" placeholder="写点助记：词根、谐音、例句…" onchange="ws('${k}').note=this.value;save()">${esc(st.note||'')}</textarea>
    <div class="row2">
      <button class="b3d ${st.st?'amber':'line'}" onclick="toggleStar('${k}')">${st.st?'★ 已收藏':'☆ 收入生词本'}</button>
      <button class="b3d ${st.z?'ghost':'red'}" onclick="toggleZhan('${k}')">${st.z?'恢复此词':'⚔ 斩'}</button>
    </div>
    <button class="b3d ghost" onclick="closeModal()">关 闭</button>`;
  $('#modal').classList.add('show');
}
function closeModal(){ $('#modal').classList.remove('show'); modalK=null; render(); }
function toggleStar(k){
  const st=ws(k); st.st=st.st?0:1; save();
  toast(st.st?'已收入生词本 ★':'已移出生词本');
  if (modalK===k) openWord(k); else render();
}
function toggleZhan(k){
  const st=ws(k);
  if (st.z){ st.z=0; st.due=today(); toast('已恢复，今天会重新出现'); }
  else { st.z=1; if(st.s===0)st.s=1; toast('⚔ 已斩 · 此词不再出现'); sfx('ok'); checkAch(); }
  save();
  if (modalK===k) openWord(k); else render();
}

/* ================= 全局点击委托 ================= */
document.addEventListener('click', e=>{
  const g=e.target.closest('.g');
  if (g && g.closest('.covered')){ g.classList.toggle('open'); return; }
  const s2=e.target.closest('[data-say2]');
  if (s2){ say(decodeURIComponent(s2.dataset.say2), 2); return; }
  const s=e.target.closest('[data-say]');
  if (s){ say(decodeURIComponent(s.dataset.say)); return; }
});
