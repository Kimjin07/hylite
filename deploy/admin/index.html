<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>学生数据后台 | HY-LITE</title>
<style>
:root{ --bg:#EFF6F3; --card:#fff; --ink:#122B26; --sub:#4C6A64; --line:#D8E6E1; --mint:#128663; --red:#C93A3F; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:'MiSans','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif; }
.wrap{ max-width:1080px; margin:0 auto; padding:24px 16px 60px; }
h1{ font-size:22px; margin:6px 0 2px; } .sub{ color:var(--sub); font-size:13px; margin-bottom:20px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; }
input,button{ font:inherit; }
input{ padding:10px 14px; border:1.5px solid var(--line); border-radius:10px; width:320px; max-width:100%; }
button{ padding:10px 18px; border:none; border-radius:10px; background:var(--mint); color:#fff; font-weight:700; cursor:pointer; }
button.ghost{ background:none; border:1.5px solid var(--line); color:var(--sub); }
table{ width:100%; border-collapse:collapse; font-size:14px; }
th,td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
th{ color:var(--sub); font-size:12px; letter-spacing:1px; }
tr.u:hover{ background:#F3FAF7; cursor:pointer; }
.pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; background:rgba(18,134,99,.12); color:var(--mint); }
.err{ color:var(--red); font-weight:700; }
.num{ font-variant-numeric:tabular-nums; }
.muted{ color:var(--sub); }
.license-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.license-code{ font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:16px; letter-spacing:.08em; }
.device-line{ font-size:12px; color:var(--sub); margin:5px 0; white-space:normal; }
.license-feedback{ min-height:20px; margin-top:8px; font-size:13px; color:var(--sub); }
.license-feedback.ok{ color:var(--mint); font-weight:700; }
.license-feedback.err{ color:var(--red); font-weight:700; }
.danger{ background:var(--red); }
#detail h2{ font-size:18px; margin:2px 0 10px; }
.bookrow{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
.bookrow b{ min-width:88px; }
@media (max-width:640px){ th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){ display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>学生数据后台</h1>
  <div class="sub">HY-LITE 环亚国际教育 · 云同步管理</div>

  <div class="card" id="loginCard">
    <div style="margin-bottom:10px;font-weight:700">管理员密钥</div>
    <input id="key" type="password" placeholder="输入管理员密钥" onkeydown="if(event.key==='Enter')enter()">
    <button onclick="enter()">进 入</button>
    <div id="loginMsg" class="err" style="margin-top:8px"></div>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <div><b id="count">0</b> 名学生 <span class="muted" id="refreshTime"></span></div>
        <div>
          <input id="q" placeholder="搜姓名/账号/同步码" style="width:220px" oninput="renderUsers()">
          <button class="ghost" onclick="loadUsers()">刷新</button>
          <button class="ghost" onclick="logout()">退出</button>
        </div>
      </div>
    </div>
    <div class="card" style="overflow-x:auto">
      <table>
        <thead><tr><th>姓名</th><th>账号</th><th>同步码</th><th>词书数</th><th>注册时间</th><th>最近活跃</th><th>最近同步</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="card" id="detail" style="display:none"></div>
    <div class="card">
      <h2 style="font-size:18px;margin:0 0 5px">English Compass 激活码</h2>
      <div class="muted" style="font-size:13px;margin-bottom:14px">一名学生一个码，每码最多绑定 2 台设备。明文激活码仅在创建时显示一次。</div>
      <div class="license-actions">
        <input id="licenseStudent" placeholder="学生姓名" style="width:220px">
        <button onclick="createLicense()">生成激活码</button>
        <button class="ghost" onclick="loadLicenses()">刷新</button>
      </div>
      <div id="newLicense" style="margin-top:12px"></div>
      <div id="licenseFeedback" class="license-feedback" aria-live="polite"></div>
    </div>
    <div class="card" style="overflow-x:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <b>激活码列表</b>
        <input id="licenseQ" placeholder="搜学生/激活码/设备" style="width:220px" oninput="renderLicenses()">
      </div>
      <table>
        <thead><tr><th>学生</th><th>激活码</th><th>状态</th><th>设备</th><th>创建时间</th><th>最近使用</th><th>操作</th></tr></thead>
        <tbody id="licenseRows"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
'use strict';
const BOOK_NAMES = { b3000:'必会3000', prep:'预备词汇', basic:'基础词汇', core:'核心词汇', green:'绿皮书', oxford:'牛津3000+5000', a1:'A1', a2:'A2', b1:'B1', b1p:'B1+', b2:'B2', lis18:'18天听力', liscene:'听力场景', sat:'SAT核心', tfr:'托福阅读', tfl:'托福听力', tfs:'托福口语', tfw:'托福写作' };
const bookName = id => BOOK_NAMES[id] || (String(id).endsWith('_r') ? (BOOK_NAMES[String(id).slice(0,-2)] || id) + ' 乱序' : id);
let KEY = sessionStorage.getItem('hy_admin_key') || '';
let USERS = [];
let LICENSES = [];
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');
const fmtT = s => s ? String(s).replace('T',' ').slice(0,16) : '—';

async function api(path, options){
  options = options || {};
  const headers = { 'X-Admin-Key': KEY };
  if (options.body !== undefined) headers['Content-Type'] = 'application/json';
  try {
    const r = await fetch('/api/admin/' + path, { method:options.method || 'GET', headers:headers, body:options.body === undefined ? undefined : JSON.stringify(options.body) });
    return r.json().catch(()=>({ok:false,error:'响应异常'}));
  } catch (e){
    return { ok:false, error:'网络暂时不可用，请重试' };
  }
}
async function enter(){
  KEY = document.getElementById('key').value.trim();
  if (!KEY){ return; }
  const r = await api('users');
  if (!r.ok){ document.getElementById('loginMsg').textContent = r.error || '密钥不对'; return; }
  sessionStorage.setItem('hy_admin_key', KEY);
  USERS = r.users || [];
  show();
}
function show(){
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('panel').style.display = '';
  renderUsers();
  loadLicenses();
}
async function loadLicenses(){
  const r = await api('compass/licenses');
  if (!r.ok){ document.getElementById('licenseRows').innerHTML = '<tr><td colspan="7" class="err">' + esc(r.error || '加载失败') + '</td></tr>'; return; }
  LICENSES = r.licenses || [];
  renderLicenses();
}
function renderLicenses(){
  const q = (document.getElementById('licenseQ').value || '').trim().toLowerCase();
  const list = LICENSES.filter(l => !q ||
    (l.student_name || '').toLowerCase().includes(q) ||
    (l.code_suffix || '').toLowerCase().includes(q) ||
    (l.devices || []).some(d => (d.device_name || '').toLowerCase().includes(q) || (d.device_id || '').toLowerCase().includes(q)));
  document.getElementById('licenseRows').innerHTML = list.map(l => {
    const devices = (l.devices || []).map(d => `<div class="device-line"><b>${esc(d.device_name || '未命名设备')}</b> · ${esc(d.device_id.slice(0,8))}… · ${fmtT(d.last_seen || d.created_at)} <button class="ghost" style="padding:2px 7px;font-size:11px" onclick="removeDevice(${l.id},'${esc(d.device_id)}')">解绑</button></div>`).join('') || '<span class="muted">尚未绑定</span>';
    return `<tr><td><b>${esc(l.student_name)}</b></td><td class="num">EC-••••-${esc(l.code_suffix)}</td><td><span class="pill">${l.active ? '启用' : '已停用'}</span></td><td>${devices}</td><td class="muted num">${fmtT(l.created_at)}</td><td class="muted num">${fmtT(l.last_used)}</td><td><button class="${l.active ? 'danger' : ''}" style="padding:5px 10px;font-size:12px" onclick="toggleLicense(${l.id},${l.active ? 0 : 1})">${l.active ? '停用' : '启用'}</button></td></tr>`;
  }).join('') || '<tr><td colspan="7" class="muted">没有匹配的激活码</td></tr>';
}
function setLicenseFeedback(text, kind){
  const box = document.getElementById('licenseFeedback');
  box.className = 'license-feedback' + (kind ? ' ' + kind : '');
  box.textContent = text || '';
}
async function createLicense(){
  const input = document.getElementById('licenseStudent');
  const name = input.value.trim();
  if (!name){ setLicenseFeedback('请先填写学生姓名','err'); input.focus(); return; }
  const r = await api('compass/licenses', { method:'POST', body:{student_name:name} });
  const box = document.getElementById('newLicense');
  if (!r.ok){ box.innerHTML = ''; setLicenseFeedback(r.error || '生成失败','err'); return; }
  box.innerHTML = '<span class="muted">请立即交给学生并妥善保存：</span> <b class="license-code">' + esc(r.license.code) + '</b> <button class="ghost" type="button" data-code="' + esc(r.license.code) + '" onclick="copyLicense(this)" style="padding:4px 10px;font-size:12px">复制</button>';
  setLicenseFeedback('激活码已生成；明文只在这里显示一次','ok');
  input.value = '';
  await loadLicenses();
}
async function copyLicense(button){
  const code = button.getAttribute('data-code') || '';
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(code);
    else { const area = document.createElement('textarea'); area.value = code; area.style.position='fixed'; area.style.opacity='0'; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove(); }
    const old = button.textContent; button.textContent = '已复制'; setLicenseFeedback('激活码已复制到剪贴板','ok'); setTimeout(() => { button.textContent = old; }, 1600);
  } catch (e){ setLicenseFeedback('复制失败，请手动选择激活码','err'); }
}
async function toggleLicense(id, active){
  const action = active ? '启用' : '停用';
  if (!window.confirm('确定要' + action + '这个激活码吗？' + (active ? '' : '停用后现有会话会立即失效。'))) return;
  const r = await api('compass/license/toggle', { method:'POST', body:{id:id,active:active} });
  if (r.ok){ setLicenseFeedback('已' + action + '激活码','ok'); loadLicenses(); }
  else setLicenseFeedback(r.error || action + '失败','err');
}
async function removeDevice(licenseId, deviceId){
  if (!window.confirm('确定解绑这台设备吗？解绑后可用名额会恢复。')) return;
  const r = await api('compass/device/remove', { method:'POST', body:{license_id:licenseId,device_id:deviceId} });
  if (r.ok){ setLicenseFeedback('设备已解绑','ok'); loadLicenses(); }
  else setLicenseFeedback(r.error || '解绑失败','err');
}
function logout(){ sessionStorage.removeItem('hy_admin_key'); location.reload(); }
async function loadUsers(){
  const r = await api('users');
  if (r.ok){ USERS = r.users || []; renderUsers(); }
}
function renderUsers(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const list = USERS.filter(u => !q ||
    (u.nickname||'').toLowerCase().includes(q) ||
    (u.username||'').toLowerCase().includes(q) ||
    (u.sync_code||'').toLowerCase().includes(q));
  document.getElementById('count').textContent = USERS.length;
  document.getElementById('refreshTime').textContent = '· ' + new Date().toTimeString().slice(0,5);
  document.getElementById('rows').innerHTML = list.map(u => `
    <tr class="u" onclick="openUser(${u.id})">
      <td><b>${esc(u.nickname)}</b></td>
      <td>${esc(u.username || '—')}</td>
      <td class="num">${esc(u.sync_code)}</td>
      <td class="num">${u.books || 0}</td>
      <td class="num muted">${fmtT(u.created_at)}</td>
      <td class="num muted">${fmtT(u.last_seen)}</td>
      <td class="num muted">${fmtT(u.last_sync)}</td>
    </tr>`).join('') || '<tr><td colspan="7" class="muted">没有匹配的学生</td></tr>';
}
async function openUser(id){
  const box = document.getElementById('detail');
  box.style.display = ''; box.innerHTML = '<span class="muted">加载中…</span>';
  const r = await api('user?id=' + id);
  if (!r.ok){ box.innerHTML = '<span class="err">' + esc(r.error) + '</span>'; return; }
  const u = r.user;
  let h = `<h2>${esc(u.nickname)} <span class="pill num">${esc(u.sync_code)}</span></h2>
    <div class="muted" style="font-size:13px;margin-bottom:10px">
      账号 ${esc(u.username || '—')} · 注册 ${fmtT(u.created_at)} · 最近活跃 ${fmtT(u.last_seen)}</div>`;
  if (!r.books.length) h += '<div class="muted">还没有同步过任何词书进度。</div>';

  // ===== 学习量统计（合并所有词书的每日日志） =====
  const daily = {};   // date -> {n:新学, q:答题}
  let totalSeen = 0;
  for (const b of r.books){
    try {
      const d = JSON.parse(b.data);
      for (const day in (d.log || {})){
        const L = d.log[day] || {};
        (daily[day] = daily[day] || { n:0, q:0 });
        daily[day].n += Number(L.n) || 0;
        daily[day].q += Number(L.q) || 0;
      }
      if (b.stat) totalSeen += b.stat.seen || 0;
    } catch(e){}
  }
  const iso = dt => dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
  const now = new Date(); const todayS = iso(now);
  const sumSince = days => {
    let n = 0, q = 0;
    for (let i = 0; i < days; i++){
      const d = new Date(now); d.setDate(d.getDate() - i);
      const L = daily[iso(d)]; if (L){ n += L.n; q += L.q; }
    }
    return { n, q };
  };
  const t1 = daily[todayS] || { n:0, q:0 }, t7 = sumSince(7), t30 = sumSince(30);
  const tAll = Object.values(daily).reduce((a, L) => ({ n:a.n+L.n, q:a.q+L.q }), { n:0, q:0 });
  h += `<div style="display:flex;gap:20px;flex-wrap:wrap;margin:6px 0 12px">
    ${[['今日',t1],['近7天',t7],['近30天',t30],['累计',tAll]].map(([lab,v]) =>
      `<div><div style="font-size:22px;font-weight:900" class="num">${v.n}</div>
       <div class="muted" style="font-size:12px">${lab}新学 · 答题${v.q}</div></div>`).join('')}
    <div><div style="font-size:22px;font-weight:900" class="num">${totalSeen}</div>
       <div class="muted" style="font-size:12px">当前已学词量</div></div>
  </div>`;
  const days14 = Object.keys(daily).sort().reverse().slice(0, 14);
  if (days14.length){
    h += `<div style="overflow-x:auto;margin-bottom:12px"><table style="font-size:13px"><thead>
      <tr><th>日期</th>${days14.map(d=>`<th class="num">${d.slice(5)}</th>`).join('')}</tr></thead><tbody>
      <tr><td class="muted">新学</td>${days14.map(d=>`<td class="num"><b>${daily[d].n}</b></td>`).join('')}</tr>
      <tr><td class="muted">答题</td>${days14.map(d=>`<td class="num muted">${daily[d].q}</td>`).join('')}</tr>
    </tbody></table></div>`;
  }
  for (const b of r.books){
    const s = b.stat || {};
    h += `<div class="bookrow">
      <b>${esc(bookName(b.book_id))}</b>
      <span class="num">已学 ${s.seen ?? '?'}</span>
      <span class="num">掌握 ${s.master ?? '?'}</span>
      <span class="num">已斩 ${s.zhan ?? '?'}</span>
      <span class="num">XP ${s.xp ?? '?'}</span>
      <span class="num">打卡 ${s.checkins ?? '?'} 天</span>
      <span class="muted num">同步于 ${fmtT(b.server_at)}${b.device ? ' · ' + esc(b.device) : ''}</span>
      <button class="ghost" style="padding:4px 12px;font-size:12px" onclick="event.stopPropagation();dl('${esc(u.sync_code)}','${b.book_id}','data')">下载备份</button>
      ${b.prev_data ? `<button class="ghost" style="padding:4px 12px;font-size:12px" onclick="event.stopPropagation();dl('${esc(u.sync_code)}','${b.book_id}','prev_data')">上一版(${fmtT(b.prev_server_at)})</button>` : ''}
    </div>`;
  }
  box.innerHTML = h;
  box.scrollIntoView({ behavior:'smooth' });
  window.__detail = r;
}
function dl(code, bookId, field){
  const b = (window.__detail && window.__detail.books || []).find(x => x.book_id === bookId);
  if (!b || !b[field]) return;
  const blob = new Blob([b[field]], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'hylite-' + code + '-' + bookId + (field === 'prev_data' ? '-上一版' : '') + '.json';
  a.click();
}
if (KEY){ enter(); }
</script>
</body>
</html>
